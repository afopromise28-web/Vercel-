/* Unconventional Wisdom — shared styles
   Palette: chocolate brown #6B4026 (--brand), warm white #FFFDF9, soft black #171513, caramel #A8734B (--gold) for highlights. Change it once here and the whole app follows. */

:root {
  --brand: #6B4026;
  --on-brand: #FFFDF9;
  --gold: #A8734B;
  --gold-deep: #8C5C38;
  --gold-soft: #F3E9DF;
  --bg: #6B4026;
  --surface: #FFFDF9;
  --surface-2: #F3ECE3;
  --ink: #FFFDF9;
  --muted: #D8CEC4;
  --line: rgba(255, 253, 249, .25);
  --on-gold: #171513;
  --btn-bg: #1C1714;
  --btn-fg: #FFFDF9;
  --good: #3F6B2B;
  --good-bg: #E3EFD6;
  --warn: #9A4A12;
  --shadow: 0 1px 2px rgba(23, 21, 19, .12), 0 8px 24px -12px rgba(23, 21, 19, .35);

  --font-head: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;

  --r-sm: 10px;
  --r-md: 18px;
  --r-lg: 28px;
  --wrap: 1120px;
  --read: 41rem;
  --tabbar-h: 64px;
}

html[data-theme="dark"] {
  --bg: #171513;
  --surface: #1F1B18;
  --surface-2: #2A2420;
  --ink: #F3EDE5;
  --muted: #BDB2A7;
  --line: #3B322C;
  --brand: #6B4026;
  --on-brand: #F3EDE5;
  --gold: #A8734B;
  --gold-deep: #C28A5E;
  --gold-soft: #2E231B;
  --on-gold: #171513;
  --btn-bg: #F3EDE5;
  --btn-fg: #171513;
  --good: #A7D58A;
  --good-bg: #2A3A20;
  --warn: #F0B27A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .6);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-bottom: var(--tabbar-h);
}
main { flex: 1; }
img, svg { max-width: 100%; display: block; }
a { color: inherit; text-underline-offset: 3px; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-head); line-height: 1.15; margin: 0 0 .5em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 750; }
h2 { font-size: clamp(1.3rem, 3vw, 1.75rem); font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 650; }
p { margin: 0 0 1em; }

:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
html[data-theme="dark"] :focus-visible { outline-color: var(--gold); }
.skip-link { position: absolute; left: -999px; top: 8px; background: var(--btn-bg); color: var(--btn-fg); padding: .6rem 1rem; border-radius: var(--r-sm); z-index: 100; }
.skip-link:focus { left: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { width: min(100% - 2rem, var(--wrap)); margin-inline: auto; }
.i { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Header ---------- */
.site-header { position: sticky; top: 0; z-index: 40; background: var(--brand); color: var(--on-brand); border-bottom: 1px solid rgba(255, 255, 255, .16); }
html[data-theme="dark"] .site-header { background: var(--bg); color: var(--ink); border-bottom-color: var(--line); }
.header-row { display: flex; align-items: center; gap: 1rem; min-height: 64px; }
.brand { display: inline-flex; align-items: center; gap: .6rem; text-decoration: none; font-family: var(--font-head); font-weight: 750; font-size: 1.1rem; letter-spacing: -.01em; }
.brand img { width: 34px; height: 34px; border-radius: 10px; }
.nav { display: none; margin-left: auto; gap: .25rem; }
.nav a, .nav button { text-decoration: none; padding: .55rem .95rem; border-radius: 999px; font-weight: 600; background: none; border: 0; cursor: pointer; }
.nav a:hover, .nav button:hover { background: rgba(255, 255, 255, .14); }
html[data-theme="dark"] .nav a:hover, html[data-theme="dark"] .nav button:hover { background: var(--surface); }
.nav a[aria-current="page"] { background: #FFFDF9; color: var(--brand); }
html[data-theme="dark"] .nav a[aria-current="page"] { background: var(--gold); color: var(--on-gold); }
.header-tools { display: flex; align-items: center; gap: .5rem; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: .35rem; padding: .35rem .75rem; border-radius: 999px; background: rgba(255, 255, 255, .14); font-weight: 650; text-decoration: none; font-size: .95rem; }
html[data-theme="dark"] .chip { background: var(--surface); }
.icon-btn { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; border: 0; background: none; cursor: pointer; }
.icon-btn:hover { background: rgba(255, 255, 255, .14); }
html[data-theme="dark"] .icon-btn:hover { background: var(--surface); }
.menu-panel { display: none; border-top: 1px solid rgba(255, 255, 255, .18); padding: .5rem 0 1rem; }
.menu-panel.open { display: block; }
.menu-panel a, .menu-panel button { display: flex; align-items: center; gap: .7rem; width: 100%; text-align: left; padding: .8rem .25rem; text-decoration: none; background: none; border: 0; font-weight: 600; cursor: pointer; border-radius: var(--r-sm); }
@media (min-width: 900px) {
  .nav { display: flex; }
  .header-tools { margin-left: 0; }
  /* keep the 3-line menu on desktop too: it opens as a dropdown under the header */
  .menu-panel { position: absolute; top: calc(100% + 6px); right: 1.25rem; width: 260px; padding: .5rem; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--ink); box-shadow: 0 12px 32px rgba(0, 0, 0, .18); }
  .menu-panel a:hover, .menu-panel button:hover { background: var(--surface-2); }
  .menu-panel a, .menu-panel button { padding: .7rem .75rem; }
}

/* ---------- Mobile tab bar (mirrors the app-style navigation in the reference screenshots) ---------- */
.tabbar { position: fixed; inset: auto 0 0 0; height: var(--tabbar-h); z-index: 45; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .74rem; font-weight: 600; color: var(--muted); text-decoration: none; background: none; border: 0; cursor: pointer; }
.tabbar .i { width: 1.45rem; height: 1.45rem; }
.tabbar [aria-current="page"] { color: var(--ink); }
.tabbar [aria-current="page"] .i-wrap { background: var(--gold); color: var(--on-gold); }
.i-wrap { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 999px; transition: background .2s; }
@media (min-width: 900px) { .tabbar { display: none; } body { padding-bottom: 0; } }

/* ---------- Buttons, cards, bits ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .8rem 1.3rem; border-radius: 999px; border: 2px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-fg); font-weight: 650; text-decoration: none; cursor: pointer; transition: transform .15s, background .15s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-gold { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.btn-sm { padding: .5rem .95rem; font-size: .92rem; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; transform: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 1.25rem; box-shadow: var(--shadow); }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.stack > * + * { margin-top: 1rem; }
.section { padding: 2.5rem 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
.section-head a { font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .65rem; border-radius: 999px; background: var(--gold); color: var(--on-gold); font-size: .85rem; font-weight: 650; }
.pill.good { background: var(--good-bg); color: var(--good); }
.progress { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.progress > span { display: block; height: 100%; background: var(--gold); border-radius: inherit; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
html[data-theme="dark"] .progress > span { background: var(--gold); }

/* ---------- Home ---------- */
.hero { background: var(--brand); color: var(--on-brand); border-radius: 0 0 var(--r-lg) var(--r-lg); padding: 1.75rem 0 2.25rem; }
html[data-theme="dark"] .hero { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-top: 0; }
.hero-grid { display: grid; gap: 1.5rem; }
.greeting { font-weight: 600; opacity: .8; margin-bottom: .4rem; }
.hero h1 { max-width: 16ch; }
.stats { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.2rem; }
.stat { display: inline-flex; align-items: center; gap: .45rem; padding: .5rem .9rem; border-radius: 999px; background: rgba(255, 255, 255, .16); font-weight: 650; text-decoration: none; }
html[data-theme="dark"] .stat { background: var(--surface-2); }
.today-card { background: var(--surface); color: var(--ink); border-radius: var(--r-lg); padding: 1.5rem; box-shadow: var(--shadow); position: relative; }
html[data-theme="dark"] .today-card { background: var(--bg); border: 1px solid var(--line); }
.today-card .label { display: flex; align-items: center; justify-content: space-between; gap: .5rem; font-weight: 600; color: var(--muted); margin-bottom: .6rem; }
.today-card .quote { font-family: var(--font-read); font-size: clamp(1.15rem, 2.6vw, 1.45rem); line-height: 1.4; margin: 0 0 1.2rem; text-wrap: pretty; }
.today-card h2 { margin-bottom: .6rem; }
.ring { --p: 0; width: 76px; height: 76px; border-radius: 50%; background: conic-gradient(var(--gold) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; flex: none; }
html[data-theme="dark"] .ring { background: conic-gradient(var(--gold) calc(var(--p) * 1%), var(--line) 0); }
.ring span { width: 62px; height: 62px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 750; font-size: 1.05rem; line-height: 1; text-align: center; }
html[data-theme="dark"] .today-card .ring span { background: var(--bg); }
.ring small { display: block; font-size: .62rem; font-weight: 600; color: var(--muted); }
.banner { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner[hidden] { display: none; }
.path { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem; }
@media (min-width: 640px) { .path { grid-template-columns: repeat(10, 1fr); } }
.path a { aspect-ratio: 1; display: grid; place-items: center; border-radius: 12px; font-weight: 700; text-decoration: none; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.path a.done { background: var(--gold); color: var(--on-gold); border-color: var(--gold-deep); }
.path a.now { border: 2px solid var(--ink); color: var(--ink); }
html[data-theme="dark"] .path a.now { border-color: var(--gold); color: var(--gold); }
.path a.locked { opacity: .55; }
.two-col { display: grid; gap: 1.25rem; }
@media (min-width: 900px) {
  .hero-grid { grid-template-columns: 1fr 1.1fr; align-items: center; gap: 3rem; }
  .two-col { grid-template-columns: 1fr 1fr; }
  .hero { padding: 3rem 0 3.5rem; }
}

/* ---------- Devotional list ---------- */
.page-head { padding: 2rem 0 1rem; }
.filters { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1rem 0 1.25rem; }
.filters button { padding: .45rem 1rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.filters button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); border-color: var(--gold-deep); }
.day-grid { display: grid; gap: .85rem; grid-template-columns: 1fr; list-style: none; padding: 0; margin: 0; }
@media (min-width: 600px) { .day-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 960px) { .day-grid { grid-template-columns: repeat(3, 1fr); } }
.day-card { display: flex; flex-direction: column; gap: .35rem; height: 100%; padding: 1.1rem 1.2rem; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); text-decoration: none; transition: border-color .15s, background .15s; }
a.day-card:hover { border-color: var(--ink); }
html[data-theme="dark"] a.day-card:hover { border-color: var(--gold); }
.day-card .top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-weight: 600; }
.day-card h3 { margin: 0; }
.day-card.current { background: var(--gold); color: var(--on-gold); border-color: var(--gold-deep); }
.day-card.current .top { color: var(--on-gold); opacity: .8; }
.day-card.locked { opacity: .6; }
.day-card .meta { margin-top: auto; padding-top: .5rem; font-size: .88rem; color: var(--muted); }
.day-card.current .meta { color: var(--on-gold); opacity: .8; }

/* ---------- Reader ---------- */
.reader { width: min(100% - 2rem, var(--read)); margin-inline: auto; padding: 1.25rem 0 3rem; }
.reader-top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: 1rem; flex-wrap: wrap; }
.read-progress { position: fixed; top: 0; left: 0; height: 4px; background: var(--gold); width: 0; z-index: 60; }
html[data-theme="dark"] .read-progress { background: var(--gold); }
.reader h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); margin-bottom: .4rem; }
.reader .meta-line { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1.5rem; }
.prose { font-family: var(--font-read); font-size: calc(1.14rem * var(--fs, 1)); line-height: 1.75; text-wrap: pretty; }
.prose p { margin-bottom: 1.15em; }
.prose strong { font-weight: 650; }
.prose blockquote { margin: 1.4em 0; padding: .9em 1.2em; background: var(--gold-soft); border-left: 5px solid var(--gold-deep); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.prose blockquote strong { font-weight: 500; }
.dose { background: var(--brand); color: var(--on-brand); border-radius: var(--r-lg); padding: 1.5rem; margin: 2rem 0; }
html[data-theme="dark"] .dose { background: var(--gold); color: var(--on-gold); }
.dose h2 { font-size: 1rem; margin-bottom: .5rem; }
.dose p { font-family: var(--font-read); font-size: 1.25rem; line-height: 1.5; margin: 0; font-weight: 600; }
.actions { display: grid; gap: .75rem; margin: 1.5rem 0; }
.action { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.1rem; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.action.done { background: var(--good-bg); border-color: transparent; color: var(--good); }
.action strong { display: block; }
.action .sub { font-size: .9rem; color: var(--muted); }
.action.done .sub { color: inherit; }
.journal { margin-top: 1.5rem; }
.journal textarea { width: 100%; min-height: 11rem; padding: 1rem; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--surface); font-family: var(--font-read); font-size: 1.05rem; line-height: 1.6; resize: vertical; }
.journal textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--gold); }
.journal-foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: .6rem; flex-wrap: wrap; }
.day-nav { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
.complete-note { margin-top: 1.5rem; text-align: center; }
.locked-box { text-align: center; padding: 3rem 1rem; }

/* ---------- Leaderboard ---------- */
.me-card { background: #1C1714; color: var(--on-brand); border-radius: var(--r-lg); padding: 1.5rem; display: grid; gap: 1.25rem; }
html[data-theme="dark"] .me-card { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.me-rank { font-family: var(--font-head); font-size: clamp(3rem, 9vw, 4.5rem); font-weight: 800; line-height: 1; letter-spacing: -.03em; }
.me-rank small { font-size: 1rem; font-weight: 600; letter-spacing: 0; margin-left: .3rem; opacity: .75; }
.me-card .progress { background: rgba(255, 255, 255, .22); border-color: rgba(255, 255, 255, .3); }
.me-card .progress > span { background: var(--gold); }
html[data-theme="dark"] .me-card .progress { background: var(--surface-2); border-color: var(--line); }
html[data-theme="dark"] .me-card .progress > span { background: var(--gold); }
@media (min-width: 760px) { .me-card { grid-template-columns: auto 1fr; align-items: center; gap: 2.5rem; padding: 2rem 2.25rem; } }
.tabs { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.tabs button { padding: .45rem 1.1rem; border-radius: 999px; border: 0; background: none; cursor: pointer; font-weight: 650; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--gold); color: var(--on-gold); }
html[data-theme="dark"] .tabs button[aria-selected="true"] { background: var(--gold); color: var(--on-gold); }
.podium { display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: .6rem; margin: 1.5rem 0; }
.podium .step { text-align: center; padding: .9rem .4rem 0; border-radius: var(--r-md) var(--r-md) 0 0; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; }
.podium .step.p1 { background: var(--gold); color: var(--on-gold); border-color: var(--gold-deep); padding-top: 1.4rem; }
.podium .step.p1 .base { height: 54px; }
.podium .step.p2 .base { height: 34px; }
.podium .step.p3 .base { height: 20px; }
.podium .base { margin-top: .8rem; background: rgba(26, 20, 16, .08); display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; }
.podium .name { font-weight: 650; overflow-wrap: anywhere; font-size: .95rem; padding-inline: .2rem; }
.podium .pts { font-size: .85rem; opacity: .8; }

        if (!user || user.uid !== u.uid) return;
        return Promise.all([
          x.d.setDoc(x.d.doc(x.db, 'leaderboard', u.uid), { name: shortName(u.name), points: pts, log: log, updatedAt: Date.now() }),
          x.d.setDoc(x.d.doc(x.db, 'users', u.uid), { progress: s.progress, log: s.log, progressAt: Date.now() }, { merge: true })
        ]);
      }).then(function () { cloudError = ''; return refreshBoard(); }).catch(function (e) { console.warn('Cloud sync failed:', e); cloudError = (e && e.code) || 'error'; fire('uw:change'); });
    }, 700);
  }
  function pullCloud(u) {
    return fsdb().then(function (x) { return x.d.getDoc(x.d.doc(x.db, 'users', u.uid)); }).then(function (snap) {
      if (!user || user.uid !== u.uid) return;
      var d = snap.exists() ? snap.data() : null, s = load();
      if (d && d.progress) Object.keys(d.progress).forEach(function (k) {
        var r = d.progress[k] && d.progress[k].read; if (!r) return;
        s.progress[k] = s.progress[k] || {};
        if (!s.progress[k].read || r < s.progress[k].read) s.progress[k].read = r;
      });
      if (d && d.log) d.log.forEach(function (e) {
        if (!s.log.some(function (l) { return l.type === e.type && l.day === e.day; })) s.log.push(e);
      });
      s.log.sort(function (a, b) { return a.ts - b.ts; });
      persist(); fire('uw:change');
      pushCloud();
    }).catch(function (e) { console.warn('Cloud load failed:', e); pushCloud(); });
  }
  function refreshBoard() {
    if (!cloudOn()) return Promise.resolve();
    if (refreshing) return refreshing;
    refreshing = fsdb().then(function (x) {
      return x.d.getDocs(x.d.query(x.d.collection(x.db, 'leaderboard'), x.d.orderBy('points', 'desc'), x.d.limit(100)));
    }).then(function (snap) {
      cloudBoard = [];
      snap.forEach(function (doc) { var d = doc.data(); cloudBoard.push({ uid: doc.id, name: d.name || 'Reader', log: d.log || [] }); });
      fire('uw:change');
          cloudError = '';
    }).catch(function (e) { console.warn('Leaderboard load failed:', e); cloudError = (e && e.code) || 'error'; fire('uw:change'); }).then(function () { refreshing = null; });
    return refreshing;
  }
  function cloudHook(u) {
    if (!cloudOn()) return;
    if (u && pulledFor !== u.uid) { pulledFor = u.uid; pullCloud(u); }
    refreshBoard();
  }

  /* ================= LEADERBOARD ================= */
  function levelFor(pts) {
    var cur = LEVELS[0], next = null;
    for (var i = 0; i < LEVELS.length; i++) { if (pts >= LEVELS[i].min) { cur = LEVELS[i]; next = LEVELS[i + 1] || null; } }
    return { cur: cur, next: next, pct: next ? Math.round(((pts - cur.min) / (next.min - cur.min)) * 100) : 100 };
  }

  function entries(period) {
    var weekly = period === 'week', list = [];
    if (cloudOn()) {
      (cloudBoard || []).forEach(function (r) {
        if (user && r.uid === user.uid) return;
        var st = statsFromLog(r.log), p = weekly ? st.week : st.points;
        if (!p) return;
        list.push({ id: r.uid, name: r.name, points: p, streak: st.streak, days: st.days, you: false });
      });
    } else if (CONFIG.showSampleParticipants) {
      SAMPLE.forEach(function (s, i) {
        list.push({ id: 's' + i, name: s[0], points: weekly ? s[2] : s[1], streak: s[3], days: Math.min(CONFIG.totalDays, Math.max(1, Math.round(s[1] / 28))), you: false });
      });
    }
    if (user) {
      var mine = weekly ? Store.weekPoints() : Store.total();
      if (mine || !cloudOn()) list.push({ id: 'you', name: cloudOn() ? shortName(user.name) : user.name, points: mine, streak: Store.streak(), days: Store.daysRead(), you: true });
    }
    list.sort(function (a, b) { return b.points - a.points || (a.you ? 1 : 0) - (b.you ? 1 : 0); });
    list.forEach(function (e, i) { e.rank = i + 1; });
    return list;
  }

  var Board = {
    entries: entries,
    refresh: refreshBoard,
    error: function () { return cloudError; },
    levelFor: levelFor,
    me: function (period) { return entries(period).filter(function (e) { return e.you; })[0] || null; },
    rankDelta: function () {
      var me = Board.me('all'); if (!me) return 0;
      var s = load(), prev = s.lastRank; s.lastRank = me.rank; persist();
      return prev ? prev - me.rank : 0;
    }
  };

  /* ================= UI HELPERS ================= */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function icon(name) { return '<svg class="i" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }

  var SPRITE = '<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">' +
    '<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 9.5V20h5v-6h4v6h5V9.5"/></symbol>' +
    '<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 004 20.5zM4 20.5A2.5 2.5 0 006.5 23H20v-5"/></symbol>' +
    '<symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 01-8 0zM8 6H4v1a4 4 0 004 4M16 6h4v1a4 4 0 01-4 4M12 14v4M8 21h8M10 18h4"/></symbol>' +
    '<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>' +
    '<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>' +
    '<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>' +
    '<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>' +
    '<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>' +
    '<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>' +
    '<symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>' +
    '<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></symbol>' +
    '<symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>' +
    '<symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>' +
    '<symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></symbol>' +
    '<symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h11a1 1 0 011 1v16a1 1 0 01-1 1H6zM6 3v18M10 8h5M10 12h5"/></symbol>' +
    '<symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 00-1 1v14a1 1 0 001 1h4M16 8l4 4-4 4M20 12H9"/></symbol>' +
    '</svg>';

  var NAV = [
    { id: 'home', label: 'Home', href: 'index.html', icon: 'home' },
    { id: 'devotional', label: 'Devotional', href: 'devotional.html', icon: 'book' },
    { id: 'journals', label: 'Journals', href: 'journals.html', icon: 'note' },
    { id: 'you', label: 'You', href: 'you.html', icon: 'user' }
  ];

  var MENU_EXTRA = [{ id: 'leaderboard', label: 'Leaderboard', href: 'leaderboard.html', icon: 'trophy' }];

  function renderHeader(page) {
    var links = NAV.map(function (n) { return '<a href="' + n.href + '"' + (n.id === page ? ' aria-current="page"' : '') + '>' + n.label + '</a>'; }).join('');
    var menuLinks = NAV.concat(MENU_EXTRA).map(function (n) { return '<a href="' + n.href + '"' + (n.id === page ? ' aria-current="page"' : '') + '>' + icon(n.icon) + n.label + '</a>'; }).join('');
    return '<header class="site-header"><div class="wrap"><div class="header-row">' +
      '<a class="brand" href="index.html"><img src="LOGO_URI" width="34" height="34" alt="Unconventional Wisdom logo">' + CONFIG.siteName + '</a>' +
      '<nav class="nav" aria-label="Main">' + links + '</nav>' +
      '<div class="header-tools"><a class="chip" href="leaderboard.html" aria-label="Your points">' + icon('bolt') + '<span data-points>0</span></a>' +
      '<button class="icon-btn menu-toggle" type="button" aria-expanded="false" aria-controls="menu-panel" aria-label="Open menu">' + icon('menu') + '</button></div></div>' +
      '<div class="menu-panel" id="menu-panel">' + menuLinks +
      '<button type="button" data-theme-toggle>' + icon('moon') + '<span data-theme-label>Dark mode</span></button></div></div></header>';
  }

  function renderTabbar(page) {
    return '<nav class="tabbar" aria-label="Primary">' + NAV.map(function (n) {
      return '<a href="' + n.href + '"' + (n.id === page ? ' aria-current="page"' : '') + '><span class="i-wrap">' + icon(n.icon) + '</span>' + n.label + '</a>';
    }).join('') + '</nav>';
  }

  function renderFooter() {
    var y = new Date().getFullYear();
    return '<footer class="site-footer"><div class="wrap"><div class="footer-grid">' +
      '<div><a class="brand" href="index.html"><img src="LOGO_URI" width="34" height="34" alt="" loading="lazy">' + CONFIG.siteName + '</a>' +
      '<p class="muted small" style="margin-top:.8rem;max-width:32ch">Practical 30 Day devotional for Leaders and builders to learn Godly Wisdom.</p></div>' +
      '<div><h2>Explore</h2><ul>' + NAV.concat(MENU_EXTRA).map(function (n) { return '<li><a href="' + n.href + '">' + n.label + '</a></li>'; }).join('') + '</ul></div>' +
      '</div><div class="footer-bottom">&copy; ' + y + ' ' + CONFIG.siteName + '. All rights reserved.</div></div></footer>';
  }

  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('uw:theme', t); } catch (e) {}
    document.querySelectorAll('[data-theme-label]').forEach(function (el) { el.textContent = t === 'dark' ? 'Light mode' : 'Dark mode'; });
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#171513' : '#FFFDF9');
  }

  var toastZone;
  function toast(msg) {
    if (!toastZone) {
      toastZone = document.createElement('div');
      toastZone.className = 'toast-zone';
      toastZone.setAttribute('aria-live', 'polite');
      document.body.appendChild(toastZone);
    }
    var t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    toastZone.appendChild(t);
    setTimeout(function () { t.remove(); }, 4200);
  }

  function goSignIn(next) { location.href = 'you.html' + (next ? '?next=' + encodeURIComponent(next) : ''); }

  function wire() {
    var toggle = document.querySelector('.menu-toggle'), panel = document.getElementById('menu-panel');
    if (toggle && panel) {
      toggle.addEventListener('click', function () {
        var open = panel.classList.toggle('open');
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        toggle.innerHTML = icon(open ? 'close' : 'menu');
      });
    }
    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-theme-toggle]')) applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
    function refreshPoints() { document.querySelectorAll('[data-points]').forEach(function (el) { el.textContent = Store.total(); }); }
    document.addEventListener('uw:change', refreshPoints);
    refreshPoints();
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');

    // live countdowns: any element with data-unlock-day ticks every second
    setInterval(function () {
      var els = document.querySelectorAll('[data-unlock-day]');
      if (!els.length) return;
      var expired = false;
      els.forEach(function (el) {
        var ms = Store.msUntil(parseInt(el.getAttribute('data-unlock-day'), 10));
        if (ms <= 0) expired = true; else el.textContent = fmt(ms);
      });
      if (expired) fire('uw:change');
    }, 1000);
  }

  function init() {
    var page = document.body.dataset.page;
    document.body.insertAdjacentHTML('afterbegin', SPRITE);
    var logo = (document.querySelector('link[rel="icon"]') || {}).href || '';
    var h = document.getElementById('site-header'); if (h) h.outerHTML = renderHeader(page).replace(/LOGO_URI/g, logo);
    var f = document.getElementById('site-footer'); if (f) f.outerHTML = renderFooter().replace(/LOGO_URI/g, logo);
    document.body.insertAdjacentHTML('beforeend', renderTabbar(page));
    wire();
    fire('uw:ready');
  }

  window.UW = { CONFIG: CONFIG, POINTS: POINTS, LEVELS: LEVELS, Store: Store, Board: Board, Auth: Auth, esc: esc, icon: icon, toast: toast, fmt: fmt, goSignIn: goSignIn };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
<script>
/* You page: sign up, sign in (email or Google), profile, log out */
(function () {
  'use strict';
  var UW = window.UW, Auth = UW.Auth, Store = UW.Store, Board = UW.Board, esc = UW.esc, icon = UW.icon;
  var root = document.getElementById('you-root');
  var mode = 'signin';

  var G = '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';

  function nextUrl() {
    var n = new URLSearchParams(location.search).get('next');
    return n && /^[a-z]+\.html(#[\w-]*)?$/i.test(n) ? n : null;
  }
  function done() { var n = nextUrl(); if (n) location.href = n; }

  function initials(name) { return String(name).split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join('') || '?'; }

  /* ---------- signed out ---------- */
  function renderForm() {
    var up = mode === 'signup';
    root.innerHTML =
      '<div class="auth-card card">' +
      '<h1 style="font-size:clamp(1.6rem,4vw,2.1rem)">' + (up ? 'Create your account' : 'Welcome back') + '</h1>' +
      '<p class="muted">' + (up ? 'Request access to Unconventional Wisdom. Your account will be activated after admin approval.' : 'Sign in to continue your 30 days.') + '</p>' +
      '<button class="btn-google" type="button" id="google-btn">' + G + '<span>Continue with Google</span></button>' +
      '<div class="divider"><span>or use your email</span></div>' +
      '<div class="tabs" role="tablist" aria-label="Account" style="margin-bottom:1rem;display:flex">' +
      '<button type="button" role="tab" data-mode="signin" aria-selected="' + !up + '" style="flex:1">Sign in</button>' +
      '<button type="button" role="tab" data-mode="signup" aria-selected="' + up + '" style="flex:1">Sign up</button></div>' +
      '<form id="auth-form" novalidate>' +
      (up ? '<div class="field"><label for="f-name">Your name</label><input id="f-name" type="text" autocomplete="name" maxlength="24" placeholder="e.g. Tobi A." required></div>' : '') +
      '<div class="field"><label for="f-email">Email</label><input id="f-email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required></div>' +
      '<div class="field"><label for="f-pw">Password</label><input id="f-pw" type="password" autocomplete="' + (up ? 'new-password' : 'current-password') + '" minlength="6" placeholder="' + (up ? 'At least 6 characters' : 'Your password') + '" required></div>' +
      '<p class="error-msg" id="auth-error" role="alert" hidden></p>' +
      '<button class="btn" type="submit" id="auth-submit" style="width:100%">' + (up ? 'Request access' : 'Sign in') + '</button>' +
      (up ? '' : '<p style="text-align:center;margin:.9rem 0 0"><button type="button" class="link-btn" id="forgot-btn">Forgot password?</button></p>') +
      '</form>' +
      (Auth.mode === 'local' ? '<p class="small muted" style="margin:1.2rem 0 0">Accounts are saved on this device only for now.</p>' : '') +
      '</div>';
  }

  function showError(msg) { var e = document.getElementById('auth-error'); if (!e) return; e.textContent = msg; e.hidden = !msg; }
  function busy(on, label) {
    var b = document.getElementById('auth-submit'); if (!b) return;
    b.disabled = on; if (label) b.textContent = on ? 'Please wait\u2026' : label;
  }

  root.addEventListener('click', function (e) {
    var m = e.target.closest('[data-mode]');
    if (m) { mode = m.dataset.mode; renderForm(); return; }
    if (e.target.closest('#google-btn')) {
      var gb = document.getElementById('google-btn'); gb.disabled = true; showError('');
      Auth.google(mode).then(function (result) { if (result && result.pending) { UW.toast('Request pending: your signup has been sent to the admin. You can sign in once it is approved.'); renderForm(); } else { UW.toast('Signed in'); done(); } }).catch(function (err) { showError(err.message); }).then(function () { gb.disabled = false; });
      return;
    }
    if (e.target.closest('#forgot-btn')) {
      showError('');
      Auth.reset(document.getElementById('f-email').value).then(function () { UW.toast('Password reset email sent'); }).catch(function (err) { showError(err.message); });
      return;
    }
    if (e.target.closest('#logout-btn')) {
      Auth.signOut().then(function () { UW.toast('Signed out'); });
      return;
    }
    if (e.target.closest('#reset-btn')) {
      if (confirm('Reset all points and progress on this device? This cannot be undone.')) { Store.reset(); UW.toast('Progress reset'); renderProfile(); }
    }
  });

  root.addEventListener('submit', function (e) {
    if (e.target.id !== 'auth-form') return;
    e.preventDefault(); showError('');
    var up = mode === 'signup', label = up ? 'Request access' : 'Sign in';
    var email = document.getElementById('f-email').value, pw = document.getElementById('f-pw').value;
    busy(true, label);
    var p = up ? Auth.signUp(document.getElementById('f-name').value, email, pw) : Auth.signIn(email, pw);
    p.then(function (result) {
      if (up && result && result.pending) {
        UW.toast('Request pending: your signup has been sent to the admin. You can sign in once it is approved.');
        renderForm();
        return;
      }
      UW.toast(up ? 'Request pending: your signup has been sent to the admin.' : 'Signed in');
      done();
    }).catch(function (err) { showError(err.message); busy(false, label); });
  });

  /* ---------- signed in ---------- */
  function renderProfile() {
    var u = Auth.user(), me = Board.me('all'), lv = Board.levelFor(Store.total());
    var n = Store.currentDay(), st = Store.state(n), nextLine;
    if (Store.allRead()) nextLine = 'You\u2019ve read all ' + UW.CONFIG.totalDays + ' days.';
    else if (st === 'waiting') nextLine = 'Day ' + n + ' opens in <b data-unlock-day="' + n + '">' + UW.fmt(Store.msUntil(n)) + '</b>';
    else nextLine = 'Day ' + n + ' is ready to read.';
    root.innerHTML =
      '<div class="auth-card card profile">' +
      '<div class="profile-head"><span class="avatar-lg" aria-hidden="true">' + esc(initials(u.name)) + '</span>' +
      '<div style="min-width:0"><h1 style="font-size:1.5rem;margin:0;overflow-wrap:anywhere">' + esc(u.name) + '</h1>' +
      '<p class="muted small" style="margin:.1rem 0 0;overflow-wrap:anywhere">' + esc(u.email || '') + (u.provider === 'google' ? ' \u00b7 Google account' : '') + '</p></div></div>' +
      '<div class="stat-grid">' +
      '<div><b>' + Store.total() + '</b><span>points</span></div>' +
      '<div><b>' + Store.daysRead() + '/' + UW.CONFIG.totalDays + '</b><span>days read</span></div>' +
      '<div><b>' + Store.streak() + '</b><span>day streak</span></div>' +
      '<div><b>' + (me ? '#' + me.rank : '-') + '</b><span>rank</span></div></div>' +
      '<p class="wait" style="margin:1rem 0">' + icon('clock') + '<span>' + nextLine + '</span></p>' +
      '<div class="profile-actions">' +
      '<a class="btn" href="' + (nextUrl() || 'devotional.html') + '">' + icon('book') + 'Continue reading</a>' +
      '<button class="btn btn-ghost" type="button" id="logout-btn">' + icon('logout') + 'Log out</button></div></div>' +
      '<div id="admin-panel"></div>' ;
    Auth.isAdmin().then(function (admin) {
      if (!admin || !Auth.user() || Auth.user().uid !== u.uid) return;
      renderAdminPanel();
    });
  }

  function renderAdminPanel() {
    var panel = document.getElementById('admin-panel'); if (!panel) return;
    panel.innerHTML = '<div class="auth-card card" style="margin-top:1rem"><h2 style="margin-top:0">Admin — Signup requests</h2><p class="muted small">Approve or reject new account requests. <a href="admin.html">Open the full admin dashboard</a></p><div id="request-list"><p class="muted">Loading requests…</p></div></div>';
    Auth.adminRequests().then(function (rows) {
      var list = document.getElementById('request-list'); if (!list) return;
      if (!rows.length) { list.innerHTML = '<p class="muted">No signup requests yet.</p>'; return; }
      list.innerHTML = rows.map(function (r) {
        var d = r.data || {};
        var status = d.status || 'pending';
        var actions = status === 'pending' ? '<button class="btn" type="button" data-approve="' + esc(r.id) + '">Approve</button><button class="btn btn-ghost" type="button" data-reject="' + esc(r.id) + '">Reject</button>' : '<span class="small muted">' + esc(status) + '</span>';
        return '<div style="padding:1rem 0;border-top:1px solid var(--line)"><b>' + esc(d.name || 'Unnamed') + '</b><div class="small muted" style="overflow-wrap:anywhere">' + esc(d.email || '') + '</div><div class="profile-actions" style="margin-top:.65rem">' + actions + '</div></div>';
      }).join('');
    }).catch(function (e) { var list = document.getElementById('request-list'); if (list) list.innerHTML = '<p class="error-msg">' + esc(e.message) + '</p>'; });
  }

  root.addEventListener('click', function (e) {
    var a = e.target.closest('[data-approve]');
    var r = e.target.closest('[data-reject]');
    if (a) { a.disabled = true; Auth.adminApprove(a.dataset.approve).then(function () { UW.toast('Member approved.'); renderAdminPanel(); }).catch(function (err) { UW.toast(err.message); a.disabled = false; }); }
    if (r) { r.disabled = true; Auth.adminReject(r.dataset.reject).then(function () { UW.toast('Request rejected.'); renderAdminPanel(); }).catch(function (err) { UW.toast(err.message); r.disabled = false; }); }
  });


  function render() { Auth.user() ? renderProfile() : renderForm(); }
  document.addEventListener('uw:auth', render);
  document.addEventListener('uw:change', function () { if (Auth.user()) renderProfile(); });
  render();
})();

</script>
</body>
</html>
