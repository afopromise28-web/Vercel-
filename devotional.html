/* Unconventional Wisdom — shared styles
   Palette: chocolate brown #6B4026 (--brand), warm white #FFFDF9, soft black #171513, caramel #A8734B (--gold) for highlights. Change it once here and the whole app follows. */

:root {
  --brand: #6B4026;
  --on-brand: #FFFDF9;
  --gold: #A8734B;
  --gold-deep: #8C5C38;
  --gold-soft: #F3E9DF;
  --bg: #6B4026;
  --surface: #FFFDF9;
  --surface-2: #F3ECE3;
  --ink: #FFFDF9;
  --muted: #D8CEC4;
  --line: rgba(255, 253, 249, .25);
  --on-gold: #171513;
  --btn-bg: #1C1714;
  --btn-fg: #FFFDF9;
  --good: #3F6B2B;
  --good-bg: #E3EFD6;
  --warn: #9A4A12;
  --shadow: 0 1px 2px rgba(23, 21, 19, .12), 0 8px 24px -12px rgba(23, 21, 19, .35);

  --font-head: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;

  --r-sm: 10px;
  --r-md: 18px;
  --r-lg: 28px;
  --wrap: 1120px;
  --read: 41rem;
  --tabbar-h: 64px;
}

html[data-theme="dark"] {
  --bg: #171513;
  --surface: #1F1B18;
  --surface-2: #2A2420;
  --ink: #F3EDE5;
  --muted: #BDB2A7;
  --line: #3B322C;
  --brand: #6B4026;
  --on-brand: #F3EDE5;
  --gold: #A8734B;
  --gold-deep: #C28A5E;
  --gold-soft: #2E231B;
  --on-gold: #171513;
  --btn-bg: #F3EDE5;
  --btn-fg: #171513;
  --good: #A7D58A;
  --good-bg: #2A3A20;
  --warn: #F0B27A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .6);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: 1rem;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-bottom: var(--tabbar-h);
}
main { flex: 1; }
img, svg { max-width: 100%; display: block; }
a { color: inherit; text-underline-offset: 3px; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-head); line-height: 1.15; margin: 0 0 .5em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 750; }
h2 { font-size: clamp(1.3rem, 3vw, 1.75rem); font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 650; }
p { margin: 0 0 1em; }

:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
html[data-theme="dark"] :focus-visible { outline-color: var(--gold); }
.skip-link { position: absolute; left: -999px; top: 8px; background: var(--btn-bg); color: var(--btn-fg); padding: .6rem 1rem; border-radius: var(--r-sm); z-index: 100; }
.skip-link:focus { left: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { width: min(100% - 2rem, var(--wrap)); margin-inline: auto; }
.i { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Header ---------- */
.site-header { position: sticky; top: 0; z-index: 40; background: var(--brand); color: var(--on-brand); border-bottom: 1px solid rgba(255, 255, 255, .16); }
html[data-theme="dark"] .site-header { background: var(--bg); color: var(--ink); border-bottom-color: var(--line); }
.header-row { display: flex; align-items: center; gap: 1rem; min-height: 64px; }
.brand { display: inline-flex; align-items: center; gap: .6rem; text-decoration: none; font-family: var(--font-head); font-weight: 750; font-size: 1.1rem; letter-spacing: -.01em; }
.brand img { width: 34px; height: 34px; border-radius: 10px; }
.nav { display: none; margin-left: auto; gap: .25rem; }
.nav a, .nav button { text-decoration: none; padding: .55rem .95rem; border-radius: 999px; font-weight: 600; background: none; border: 0; cursor: pointer; }
.nav a:hover, .nav button:hover { background: rgba(255, 255, 255, .14); }
html[data-theme="dark"] .nav a:hover, html[data-theme="dark"] .nav button:hover { background: var(--surface); }
.nav a[aria-current="page"] { background: #FFFDF9; color: var(--brand); }
html[data-theme="dark"] .nav a[aria-current="page"] { background: var(--gold); color: var(--on-gold); }
.header-tools { display: flex; align-items: center; gap: .5rem; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: .35rem; padding: .35rem .75rem; border-radius: 999px; background: rgba(255, 255, 255, .14); font-weight: 650; text-decoration: none; font-size: .95rem; }
html[data-theme="dark"] .chip { background: var(--surface); }
.icon-btn { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; border: 0; background: none; cursor: pointer; }
.icon-btn:hover { background: rgba(255, 255, 255, .14); }
html[data-theme="dark"] .icon-btn:hover { background: var(--surface); }
.menu-panel { display: none; border-top: 1px solid rgba(255, 255, 255, .18); padding: .5rem 0 1rem; }
.menu-panel.open { display: block; }
.menu-panel a, .menu-panel button { display: flex; align-items: center; gap: .7rem; width: 100%; text-align: left; padding: .8rem .25rem; text-decoration: none; background: none; border: 0; font-weight: 600; cursor: pointer; border-radius: var(--r-sm); }
@media (min-width: 900px) {
  .nav { display: flex; }
  .header-tools { margin-left: 0; }
  /* keep the 3-line menu on desktop too: it opens as a dropdown under the header */
  .menu-panel { position: absolute; top: calc(100% + 6px); right: 1.25rem; width: 260px; padding: .5rem; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--ink); box-shadow: 0 12px 32px rgba(0, 0, 0, .18); }
  .menu-panel a:hover, .menu-panel button:hover { background: var(--surface-2); }
  .menu-panel a, .menu-panel button { padding: .7rem .75rem; }
}

/* ---------- Mobile tab bar (mirrors the app-style navigation in the reference screenshots) ---------- */
.tabbar { position: fixed; inset: auto 0 0 0; height: var(--tabbar-h); z-index: 45; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .74rem; font-weight: 600; color: var(--muted); text-decoration: none; background: none; border: 0; cursor: pointer; }
.tabbar .i { width: 1.45rem; height: 1.45rem; }
.tabbar [aria-current="page"] { color: var(--ink); }
.tabbar [aria-current="page"] .i-wrap { background: var(--gold); color: var(--on-gold); }
.i-wrap { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 999px; transition: background .2s; }
@media (min-width: 900px) { .tabbar { display: none; } body { padding-bottom: 0; } }

/* ---------- Buttons, cards, bits ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .8rem 1.3rem; border-radius: 999px; border: 2px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-fg); font-weight: 650; text-decoration: none; cursor: pointer; transition: transform .15s, background .15s; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-gold { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.btn-sm { padding: .5rem .95rem; font-size: .92rem; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; transform: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 1.25rem; box-shadow: var(--shadow); }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.stack > * + * { margin-top: 1rem; }
.section { padding: 2.5rem 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
.section-head a { font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .65rem; border-radius: 999px; background: var(--gold); color: var(--on-gold); font-size: .85rem; font-weight: 650; }
.pill.good { background: var(--good-bg); color: var(--good); }
.progress { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.progress > span { display: block; height: 100%; background: var(--gold); border-radius: inherit; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
html[data-theme="dark"] .progress > span { background: var(--gold); }

/* ---------- Home ---------- */
.hero { background: var(--brand); color: var(--on-brand); border-radius: 0 0 var(--r-lg) var(--r-lg); padding: 1.75rem 0 2.25rem; }
html[data-theme="dark"] .hero { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-top: 0; }
.hero-grid { display: grid; gap: 1.5rem; }
.greeting { font-weight: 600; opacity: .8; margin-bottom: .4rem; }
.hero h1 { max-width: 16ch; }
.stats { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.2rem; }
.stat { display: inline-flex; align-items: center; gap: .45rem; padding: .5rem .9rem; border-radius: 999px; background: rgba(255, 255, 255, .16); font-weight: 650; text-decoration: none; }
html[data-theme="dark"] .stat { background: var(--surface-2); }
.today-card { background: var(--surface); color: var(--ink); border-radius: var(--r-lg); padding: 1.5rem; box-shadow: var(--shadow); position: relative; }
html[data-theme="dark"] .today-card { background: var(--bg); border: 1px solid var(--line); }
.today-card .label { display: flex; align-items: center; justify-content: space-between; gap: .5rem; font-weight: 600; color: var(--muted); margin-bottom: .6rem; }
.today-card .quote { font-family: var(--font-read); font-size: clamp(1.15rem, 2.6vw, 1.45rem); line-height: 1.4; margin: 0 0 1.2rem; text-wrap: pretty; }
.today-card h2 { margin-bottom: .6rem; }
.ring { --p: 0; width: 76px; height: 76px; border-radius: 50%; background: conic-gradient(var(--gold) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; flex: none; }
html[data-theme="dark"] .ring { background: conic-gradient(var(--gold) calc(var(--p) * 1%), var(--line) 0); }
.ring span { width: 62px; height: 62px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 750; font-size: 1.05rem; line-height: 1; text-align: center; }
html[data-theme="dark"] .today-card .ring span { background: var(--bg); }
.ring small { display: block; font-size: .62rem; font-weight: 600; color: var(--muted); }
.banner { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner[hidden] { display: none; }
.path { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem; }
@media (min-width: 640px) { .path { grid-template-columns: repeat(10, 1fr); } }
.path a { aspect-ratio: 1; display: grid; place-items: center; border-radius: 12px; font-weight: 700; text-decoration: none; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.path a.done { background: var(--gold); color: var(--on-gold); border-color: var(--gold-deep); }
.path a.now { border: 2px solid var(--ink); color: var(--ink); }
html[data-theme="dark"] .path a.now { border-color: var(--gold); color: var(--gold); }
.path a.locked { opacity: .55; }
.two-col { display: grid; gap: 1.25rem; }
@media (min-width: 900px) {
  .hero-grid { grid-template-columns: 1fr 1.1fr; align-items: center; gap: 3rem; }
  .two-col { grid-template-columns: 1fr 1fr; }
  .hero { padding: 3rem 0 3.5rem; }
}

/* ---------- Devotional list ---------- */
.page-head { padding: 2rem 0 1rem; }
.filters { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1rem 0 1.25rem; }
.filters button { padding: .45rem 1rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.filters button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); border-color: var(--gold-deep); }
.day-grid { display: grid; gap: .85rem; grid-template-columns: 1fr; list-style: none; padding: 0; margin: 0; }
@media (min-width: 600px) { .day-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 960px) { .day-grid { grid-template-columns: repeat(3, 1fr); } }
.day-card { display: flex; flex-direction: column; gap: .35rem; height: 100%; padding: 1.1rem 1.2rem; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); text-decoration: none; transition: border-color .15s, background .15s; }
a.day-card:hover { border-color: var(--ink); }
html[data-theme="dark"] a.day-card:hover { border-color: var(--gold); }
.day-card .top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-weight: 600; }
.day-card h3 { margin: 0; }
.day-card.current { background: var(--gold); color: var(--on-gold); border-color: var(--gold-deep); }
.day-card.current .top { color: var(--on-gold); opacity: .8; }
.day-card.locked { opacity: .6; }
.day-card .meta { margin-top: auto; padding-top: .5rem; font-size: .88rem; color: var(--muted); }
.day-card.current .meta { color: var(--on-gold); opacity: .8; }

/* ---------- Reader ---------- */
.reader { width: min(100% - 2rem, var(--read)); margin-inline: auto; padding: 1.25rem 0 3rem; }
.reader-top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: 1rem; flex-wrap: wrap; }
.read-progress { position: fixed; top: 0; left: 0; height: 4px; background: var(--gold); width: 0; z-index: 60; }
html[data-theme="dark"] .read-progress { background: var(--gold); }
.reader h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); margin-bottom: .4rem; }
.reader .meta-line { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1.5rem; }
.prose { font-family: var(--font-read); font-size: calc(1.14rem * var(--fs, 1)); line-height: 1.75; text-wrap: pretty; }
.prose p { margin-bottom: 1.15em; }
.prose strong { font-weight: 650; }
.prose blockquote { margin: 1.4em 0; padding: .9em 1.2em; background: var(--gold-soft); border-left: 5px solid var(--gold-deep); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.prose blockquote strong { font-weight: 500; }
.dose { background: var(--brand); color: var(--on-brand); border-radius: var(--r-lg); padding: 1.5rem; margin: 2rem 0; }
html[data-theme="dark"] .dose { background: var(--gold); color: var(--on-gold); }
.dose h2 { font-size: 1rem; margin-bottom: .5rem; }
.dose p { font-family: var(--font-read); font-size: 1.25rem; line-height: 1.5; margin: 0; font-weight: 600; }
.actions { display: grid; gap: .75rem; margin: 1.5rem 0; }
.action { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.1rem; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.action.done { background: var(--good-bg); border-color: transparent; color: var(--good); }
.action strong { display: block; }
.action .sub { font-size: .9rem; color: var(--muted); }
.action.done .sub { color: inherit; }
.journal { margin-top: 1.5rem; }
.journal textarea { width: 100%; min-height: 11rem; padding: 1rem; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--surface); font-family: var(--font-read); font-size: 1.05rem; line-height: 1.6; resize: vertical; }
.journal textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--gold); }
.journal-foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: .6rem; flex-wrap: wrap; }
.day-nav { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
.complete-note { margin-top: 1.5rem; text-align: center; }
.locked-box { text-align: center; padding: 3rem 1rem; }

/* ---------- Leaderboard ---------- */
.me-card { background: #1C1714; color: var(--on-brand); border-radius: var(--r-lg); padding: 1.5rem; display: grid; gap: 1.25rem; }
html[data-theme="dark"] .me-card { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.me-rank { font-family: var(--font-head); font-size: clamp(3rem, 9vw, 4.5rem); font-weight: 800; line-height: 1; letter-spacing: -.03em; }
.me-rank small { font-size: 1rem; font-weight: 600; letter-spacing: 0; margin-left: .3rem; opacity: .75; }
.me-card .progress { background: rgba(255, 255, 255, .22); border-color: rgba(255, 255, 255, .3); }
.me-card .progress > span { background: var(--gold); }
html[data-theme="dark"] .me-card .progress { background: var(--surface-2); border-color: var(--line); }
html[data-theme="dark"] .me-card .progress > span { background: var(--gold); }
@media (min-width: 760px) { .me-card { grid-template-columns: auto 1fr; align-items: center; gap: 2.5rem; padding: 2rem 2.25rem; } }
.tabs { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.tabs button { padding: .45rem 1.1rem; border-radius: 999px; border: 0; background: none; cursor: pointer; font-weight: 650; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--gold); color: var(--on-gold); }
html[data-theme="dark"] .tabs button[aria-selected="true"] { background: var(--gold); color: var(--on-gold); }
.podium { display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: .6rem; margin: 1.5rem 0; }
.podium .step { text-align: center; padding: .9rem .4rem 0; border-radius: var(--r-md) var(--r-md) 0 0; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; }
.podium .step.p1 { background: var(--gold); color: var(--on-gold); border-color: var(--gold-deep); padding-top: 1.4rem; }
.podium .step.p1 .base { height: 54px; }
.podium .step.p2 .base { height: 34px; }
.podium .step.p3 .base { height: 20px; }
.podium .base { margin-top: .8rem; background: rgba(26, 20, 16, .08); display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; }
.podium .name { font-weight: 650; overflow-wrap: anywhere; font-size: .95rem; padding-inline: .2rem; }
.podium .pts { font-size: .85rem; opacity: .8; }

/* Unconventional Wisdom — core: settings, accounts, storage, points, shared components */
(function () {
  'use strict';

  var CONFIG = {
    siteName: 'Unconventional Wisdom',
    totalDays: 30,

    showSampleParticipants: false,   // demo names are only used before Firebase is connected
    firebase: (window.UW_FIREBASE && window.UW_FIREBASE.apiKey) ? window.UW_FIREBASE : {
      apiKey: "AIzaSyCRiFj2kXIPGi2ZDPzePPYzVC4g0H4k5R8",
      authDomain: "unconventional-wisdom.firebaseapp.com",
      projectId: "unconventional-wisdom",
      storageBucket: "unconventional-wisdom.firebasestorage.app",
      messagingSenderId: "691189920435",
      appId: "1:691189920435:web:c73508ac2f0c5bff8a76c6",
      measurementId: "G-JCB93RP5YF"
    }
  };

  var POINTS = { read: 20, streakPerDay: 0, streakMaxDays: 7 };

  var LEVELS = [
    { name: 'Seeker', min: 0 }, { name: 'Learner', min: 100 }, { name: 'Builder', min: 250 },
    { name: 'Discerner', min: 450 }, { name: 'Steward', min: 700 }, { name: 'Sage', min: 950 }

  // Demo participants: name, all-time points, points this week, streak
  var SAMPLE = [
    ['Adaeze O.', 840, 150, 21], ['Tobi A.', 690, 142, 17], ['Grace M.', 610, 160, 15],
    ['Daniel K.', 520, 120, 12], ['Esther N.', 440, 96, 10], ['Samuel B.', 360, 84, 9],
    ['Ruth E.', 300, 78, 8], ['Michael T.', 240, 60, 6], ['Chidera U.', 190, 52, 5],
    ['Joy A.', 140, 44, 4], ['Kemi L.', 100, 36, 3], ['David P.', 70, 30, 2],
    ['Naomi R.', 40, 20, 2], ['Peter S.', 20, 20, 1]
  ];

  function fire(name) { document.dispatchEvent(new CustomEvent(name)); }

  /* ================= SESSION + STORAGE ================= */
  var user = null;                                  // { uid, name, email, provider }
  try { user = JSON.parse(localStorage.getItem('uw:user')) || null; } catch (e) { user = null; }
  var memory = null;

  function key() { return 'uw:v2:' + (user ? user.uid : 'guest'); }
  function blank() { return { progress: {}, log: [], lastRank: null }; }
  function load() {
    if (!user) { memory = blank(); return memory; }   /* progress only exists for signed-in accounts */
    if (memory) return memory;
    try { memory = JSON.parse(localStorage.getItem(key())) || blank(); } catch (e) { memory = blank(); }
    memory.progress = memory.progress || {};

  }
  function persist() { if (!user) return; try { localStorage.setItem(key(), JSON.stringify(memory)); } catch (e) { /* storage blocked */ } }
  function save() { persist(); fire('uw:change'); pushCloud(); }
  function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function fmt(ms) {
    var t = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    return h > 0 ? h + 'h ' + pad(m) + 'm' : m + 'm ' + pad(s) + 's';
  }

  var Store = {
    user: function () { return user; },
    progress: function (day) { return load().progress[day] || {}; },

    /** Time (ms since epoch) when a day opens. 0 = open now, Infinity = previous day not read yet. */
    unlockAt: function (day) {
      if (day <= 1) return 0;
      var prev = Store.progress(day - 1).read;
      if (!prev) return Infinity;
      /* A new day opens at 5am local time on the next devotional day (a day runs 5am to 5am). */
      var shifted = new Date(prev - CONFIG.unlockHour * 36e5);
      return new Date(shifted.getFullYear(), shifted.getMonth(), shifted.getDate() + 1, CONFIG.unlockHour, 0, 0, 0).getTime();
    },
    msUntil: function (day) { return Store.unlockAt(day) - Date.now(); },
    isUnlocked: function (day) { return Store.msUntil(day) <= 0; },
    /** 'read' | 'open' | 'waiting' (countdown to 5am running) | 'locked' (previous day not read) */
    state: function (day) {
      if (Store.progress(day).read) return 'read';

    },
    daysRead: function () { var p = load().progress; return Object.keys(p).filter(function (k) { return p[k].read; }).length; },
    currentDay: function () {

      return CONFIG.totalDays;
    },
    allRead: function () { return Store.daysRead() >= CONFIG.totalDays; },
    total: function () { return load().log.reduce(function (a, e) { return a + e.pts; }, 0); },
    weekPoints: function () {
      var cut = Date.now() - 7 * 864e5;
      return load().log.reduce(function (a, e) { return e.ts >= cut ? a + e.pts : a; }, 0);
    },
    streak: function () {
      var days = {};
      load().log.forEach(function (e) { if (e.type === 'read') days[dayKey(e.ts)] = true; });
      var n = 0, t = Date.now();
      if (!days[dayKey(t)]) t -= 864e5;
      while (days[dayKey(t)]) { n++; t -= 864e5; }
      return n;
    },
    reset: function () { memory = blank(); save(); },

    /** Mark a day as read and award points. Needs a signed-in user and an unlocked day. */
    award: function (day) {
      if (!user || !user.uid) return null;   /* sign-in required to complete a day */
      var s = load();
      s.progress[day] = s.progress[day] || {};
      if (s.progress[day].read || !Store.isUnlocked(day)) return null;
      var now = Date.now();
      var firstToday = !s.log.some(function (e) { return e.type === 'read' && dayKey(e.ts) === dayKey(now); });
      s.progress[day].read = now;
      s.log.push({ ts: now, pts: POINTS.read, type: 'read', day: day });
      var lines = [{ pts: POINTS.read, label: 'Read' }];
      if (firstToday) {
        var st = Store.streak(), bonus = POINTS.streakPerDay * Math.min(st, POINTS.streakMaxDays);
        if (bonus > 0) { lines.push({ pts: bonus, label: st + '-day streak' }); s.log.push({ ts: now, pts: bonus, type: 'streak', day: day }); }
      }
      save();
      return { gained: lines.reduce(function (a, l) { return a + l.pts; }, 0), lines: lines };
    }
  };

  /* ================= ACCOUNTS ================= */
  function setUser(u) {
    var changed = (u && u.uid) !== (user && user.uid);
    user = u;
    try { if (u) localStorage.setItem('uw:user', JSON.stringify(u)); else localStorage.removeItem('uw:user'); } catch (e) {}
    if (changed) memory = null;
    fire('uw:auth');
    fire('uw:change');
    cloudHook(u);
  }

  function cleanEmail(e) { return String(e || '').trim().toLowerCase(); }
  function validEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
  function fail(msg) { return Promise.reject(new Error(msg)); }

  function friendly(err) {
    var c = err && err.code || '';
    var map = {
      'auth/invalid-credential': 'Incorrect email or password.',
      'auth/wrong-password': 'Incorrect email or password.',
      'auth/user-not-found': 'Incorrect email or password.',
      'auth/invalid-login-credentials': 'Incorrect email or password.',
      'auth/email-already-in-use': 'An account with this email already exists. Try signing in.',
      'auth/weak-password': 'Use at least 6 characters for your password.',
      'auth/invalid-email': 'That email address does not look right.',
      'auth/missing-password': 'Enter your password.',
      'auth/popup-closed-by-user': 'Google sign-in was cancelled.',
      'auth/cancelled-popup-request': 'Google sign-in was cancelled.',
      'auth/network-request-failed': 'Network problem. Check your connection and try again.',
      'auth/too-many-requests': 'Too many attempts. Wait a moment and try again.',
      'auth/unauthorized-domain': 'This website address is not authorised in Firebase yet (Authentication > Settings > Authorized domains).',
      'auth/operation-not-allowed': 'This sign-in method is not turned on in Firebase yet.',
      'auth/user-disabled': 'This account has been disabled.'
    };
    return map[c] || (err && err.message && !c ? err.message : 'Something went wrong. Please try again.');
  }

  /* ---- Firebase mode (real accounts, Google sign-in) ---- */
  var fbPromise = null;
  function fb() {
    if (fbPromise) return fbPromise;
    var base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    fbPromise = Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js')]).then(function (m) {
      var app = m[0].initializeApp(CONFIG.firebase);
      return { app: app, auth: m[1].getAuth(app), a: m[1] };
    });
    return fbPromise;
  }
  function mapFb(u) {
    if (!u) return null;
    var email = u.email || '';
    return { uid: u.uid, name: u.displayName || email.split('@')[0] || 'Reader', email: email, provider: (u.providerData[0] && u.providerData[0].providerId === 'google.com') ? 'google' : 'email' };
  }

  /* ---- Local mode (accounts kept on this device only; used until Firebase is configured) ---- */
  function accounts() { try { return JSON.parse(localStorage.getItem('uw:accounts')) || {}; } catch (e) { return {}; } }
  function saveAccounts(a) { try { localStorage.setItem('uw:accounts', JSON.stringify(a)); } catch (e) {} }
  function hash(pw, salt) {
    var s = salt + '|' + pw;
    if (window.crypto && crypto.subtle && window.TextEncoder) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      });
    }

    return Promise.resolve('x' + h);
  }

  /* Approval gate: sign-up and sign-in live on you.html (admin approval). Anyone not approved is signed out here. */
  function goAccount() { window.location.href = 'you.html'; return new Promise(function () {}); }
  function approvedGate(f, u) {
    return import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function (d) {
      var db = d.getFirestore(f.app);
      return d.getDoc(d.doc(db, 'users', u.uid)).then(function (s) {
        if (s.exists() && s.data().status === 'approved') return true;
        return d.getDoc(d.doc(db, 'config', 'admins')).then(function (r) { return r.exists() && (r.data().uids || []).indexOf(u.uid) > -1; }).catch(function () { return false; });
      });
    });
  }

  var Auth = {
    mode: CONFIG.firebase ? 'firebase' : 'local',
    user: function () { return user; },

    signUp: function (name, email, pw) {
      if (Auth.mode === 'firebase') return goAccount();
      name = String(name || '').replace(/\s+/g, ' ').trim().slice(0, 24);
      email = cleanEmail(email);
      if (!name) return fail('Enter your name.');
      if (!validEmail(email)) return fail('That email address does not look right.');
      if (String(pw || '').length < 6) return fail('Use at least 6 characters for your password.');
      if (Auth.mode === 'firebase') {
        return fb().then(function (f) {
          return f.a.createUserWithEmailAndPassword(f.auth, email, pw).then(function (cred) {
            return f.a.updateProfile(cred.user, { displayName: name }).then(function () { setUser(mapFb(f.auth.currentUser)); });
          });
        }).catch(function (e) { throw new Error(friendly(e)); });
      }
      var all = accounts();
      if (all[email]) return fail('An account with this email already exists. Try signing in.');
      var salt = Math.random().toString(36).slice(2), uid = 'l_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      return hash(pw, salt).then(function (h) {
        all[email] = { uid: uid, name: name, salt: salt, hash: h };
        saveAccounts(all);
        setUser({ uid: uid, name: name, email: email, provider: 'email' });
      });
    },

    signIn: function (email, pw) {
      if (Auth.mode === 'firebase') return goAccount();
      email = cleanEmail(email);
      if (!validEmail(email)) return fail('That email address does not look right.');
      if (!pw) return fail('Enter your password.');
      if (Auth.mode === 'firebase') {
        return fb().then(function (f) { return f.a.signInWithEmailAndPassword(f.auth, email, pw); })
          .then(function (cred) { setUser(mapFb(cred.user)); })
          .catch(function (e) { throw new Error(friendly(e)); });
      }
      var acc = accounts()[email];
      if (!acc) return fail('Incorrect email or password.');
      return hash(pw, acc.salt).then(function (h) {
        if (h !== acc.hash) throw new Error('Incorrect email or password.');
        setUser({ uid: acc.uid, name: acc.name, email: email, provider: 'email' });
      });
    },

    google: function () {
      if (Auth.mode === 'firebase') return goAccount();
      if (Auth.mode !== 'firebase') return fail('Google sign-in is not switched on yet. Add your Firebase settings to firebase-config.js (see the README).');
      return fb().then(function (f) {
        var provider = new f.a.GoogleAuthProvider();
        return f.a.signInWithPopup(f.auth, provider).then(function (cred) { setUser(mapFb(cred.user)); }).catch(function (e) {
          if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) {
            return f.a.signInWithRedirect(f.auth, provider);   // page leaves and returns signed in
          }
          throw e;
        });
      }).catch(function (e) { throw new Error(friendly(e)); });
    },

    reset: function (email) {
      email = cleanEmail(email);
      if (!validEmail(email)) return fail('Enter your email above first.');
      if (Auth.mode !== 'firebase') return fail('Password reset needs Firebase to be switched on.');
      return fb().then(function (f) { return f.a.sendPasswordResetEmail(f.auth, email); }).catch(function (e) { throw new Error(friendly(e)); });
    },

    signOut: function () {
      if (Auth.mode === 'firebase') {
        return fb().then(function (f) { return f.a.signOut(f.auth); }).then(function () { setUser(null); }).catch(function () { setUser(null); });
      }
      setUser(null);
      return Promise.resolve();
    }
  };

  if (Auth.mode === 'firebase') {
    fb().then(function (f) { f.a.onAuthStateChanged(f.auth, function (u) {
      if (!u) { setUser(null); return; }
      approvedGate(f, u).then(function (ok) {
        if (ok) setUser(mapFb(u)); else f.a.signOut(f.auth).then(function () { setUser(null); });
      }).catch(function () { setUser(mapFb(u)); });
    }); }).catch(function () { /* offline: keep cached session */ });
  } else if (user && String(user.uid).indexOf('l_') !== 0) {
    user = null;   // stale Firebase session cached while Firebase is not configured
  }

  /* ================= CLOUD SYNC (Firestore) =================
     Progress is saved to the signed-in account, and every reader's points are published to a shared
     "leaderboard" collection, so the ranking is the same on every phone. */
  var cloudError = '', cloudBoard = null, pushTimer = null, refreshing = null, pulledFor = null, fsPromise = null;
  function cloudOn() { return Auth.mode === 'firebase'; }
  function fsdb() {
    if (fsPromise) return fsPromise;
    fsPromise = fb().then(function (f) {
      if (f.db && f.d) return { db: f.db, d: f.d };
      return import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(function (d) { return { db: d.getFirestore(f.app), d: d }; });
    });
    return fsPromise;
  }
  function shortName(n) {
    var p = String(n || 'Reader').trim().split(/\s+/);
    return p.length > 1 ? p[0] + ' ' + p[p.length - 1].charAt(0).toUpperCase() + '.' : p[0];
  }
  function statsFromLog(log) {
    var now = Date.now(), cut = now - 7 * 864e5, pts = 0, week = 0, days = 0, set = {};
    (log || []).forEach(function (e) {
      var ts = e.ts, p = e.pts || 0;
      pts += p; if (ts >= cut) week += p;
      if (e.type === 'read') { days++; set[dayKey(ts)] = true; }
    });
    var n = 0, t = now;
    if (!set[dayKey(t)]) t -= 864e5;
    while (set[dayKey(t)]) { n++; t -= 864e5; }
    return { points: pts, week: week, days: days, streak: n };
  }
  function pushCloud() {
    if (!cloudOn() || !user) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      var u = user; if (!u) return;
      var s = load(), pts = Store.total();
      var log = s.log.map(function (e) { return { ts: e.ts, pts: e.pts, type: e.type, day: e.day || 0 }; });
      fsdb().then(function (x) {
        if (!user || user.uid !== u.uid) return;
        return Promise.all([
          x.d.setDoc(x.d.doc(x.db, 'leaderboard', u.uid), { name: shortName(u.name), points: pts, log: log, updatedAt: Date.now() }),
          x.d.setDoc(x.d.doc(x.db, 'users', u.uid), { progress: s.progress, log: s.log, progressAt: Date.now() }, { merge: true })
        ]);
      }).then(function () { cloudError = ''; return refreshBoard(); }).catch(function (e) { console.warn('Cloud sync failed:', e); cloudError = (e && e.code) || 'error'; fire('uw:change'); });
    }, 700);
  }
  function pullCloud(u) {
    return fsdb().then(function (x) { return x.d.getDoc(x.d.doc(x.db, 'users', u.uid)); }).then(function (snap) {
      if (!user || user.uid !== u.uid) return;
      var d = snap.exists() ? snap.data() : null, s = load();
      if (d && d.progress) Object.keys(d.progress).forEach(function (k) {
        var r = d.progress[k] && d.progress[k].read; if (!r) return;
        s.progress[k] = s.progress[k] || {};
        if (!s.progress[k].read || r < s.progress[k].read) s.progress[k].read = r;
      });
      if (d && d.log) d.log.forEach(function (e) {
        if (!s.log.some(function (l) { return l.type === e.type && l.day === e.day; })) s.log.push(e);
      });
      s.log.sort(function (a, b) { return a.ts - b.ts; });
      persist(); fire('uw:change');
      pushCloud();
    }).catch(function (e) { console.warn('Cloud load failed:', e); pushCloud(); });
  }
  function refreshBoard() {
    if (!cloudOn()) return Promise.resolve();
    if (refreshing) return refreshing;
    refreshing = fsdb().then(function (x) {
      return x.d.getDocs(x.d.query(x.d.collection(x.db, 'leaderboard'), x.d.orderBy('points', 'desc'), x.d.limit(100)));
    }).then(function (snap) {
      cloudBoard = [];
      snap.forEach(function (doc) { var d = doc.data(); cloudBoard.push({ uid: doc.id, name: d.name || 'Reader', log: d.log || [] }); });
      fire('uw:change');
          cloudError = '';
    }).catch(function (e) { console.warn('Leaderboard load failed:', e); cloudError = (e && e.code) || 'error'; fire('uw:change'); }).then(function () { refreshing = null; });
    return refreshing;
  }
  function cloudHook(u) {
    if (!cloudOn()) return;
    if (u && pulledFor !== u.uid) { pulledFor = u.uid; pullCloud(u); }
    refreshBoard();
  }

  /* ================= LEADERBOARD ================= */
  function levelFor(pts) {
    var cur = LEVELS[0], next = null;
    for (var i = 0; i < LEVELS.length; i++) { if (pts >= LEVELS[i].min) { cur = LEVELS[i]; next = LEVELS[i + 1] || null; } }
    return { cur: cur, next: next, pct: next ? Math.round(((pts - cur.min) / (next.min - cur.min)) * 100) : 100 };
  }

  function entries(period) {
    var weekly = period === 'week', list = [];
    if (cloudOn()) {
      (cloudBoard || []).forEach(function (r) {
        if (user && r.uid === user.uid) return;
        var st = statsFromLog(r.log), p = weekly ? st.week : st.points;
        if (!p) return;
        list.push({ id: r.uid, name: r.name, points: p, streak: st.streak, days: st.days, you: false });
      });
    } else if (CONFIG.showSampleParticipants) {
      SAMPLE.forEach(function (s, i) {
        list.push({ id: 's' + i, name: s[0], points: weekly ? s[2] : s[1], streak: s[3], days: Math.min(CONFIG.totalDays, Math.max(1, Math.round(s[1] / 28))), you: false });
      });
    }
    if (user) {
      var mine = weekly ? Store.weekPoints() : Store.total();
      if (mine || !cloudOn()) list.push({ id: 'you', name: cloudOn() ? shortName(user.name) : user.name, points: mine, streak: Store.streak(), days: Store.daysRead(), you: true });
    }
    list.sort(function (a, b) { return b.points - a.points || (a.you ? 1 : 0) - (b.you ? 1 : 0); });
    list.forEach(function (e, i) { e.rank = i + 1; });
    return list;
  }

  var Board = {
    entries: entries,
    refresh: refreshBoard,
    error: function () { return cloudError; },
    levelFor: levelFor,
    me: function (period) { return entries(period).filter(function (e) { return e.you; })[0] || null; },
    rankDelta: function () {
      var me = Board.me('all'); if (!me) return 0;
      var s = load(), prev = s.lastRank; s.lastRank = me.rank; persist();
      return prev ? prev - me.rank : 0;
    }
  };

  /* ================= UI HELPERS ================= */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function icon(name) { return '<svg class="i" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }

  var SPRITE = '<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">' +
    '<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 9.5V20h5v-6h4v6h5V9.5"/></symbol>' +
    '<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 004 20.5zM4 20.5A2.5 2.5 0 006.5 23H20v-5"/></symbol>' +
    '<symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 01-8 0zM8 6H4v1a4 4 0 004 4M16 6h4v1a4 4 0 01-4 4M12 14v4M8 21h8M10 18h4"/></symbol>' +
    '<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>' +
    '<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>' +
    '<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>' +
    '<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>' +
    '<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>' +
    '<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>' +

    var links = NAV.map(function (n) { return '<a href="' + n.href + '"' + (n.id === page ? ' aria-current="page"' : '') + '>' + n.label + '</a>'; }).join('');
    var menuLinks = NAV.concat(MENU_EXTRA).map(function (n) { return '<a href="' + n.href + '"' + (n.id === page ? ' aria-current="page"' : '') + '>' + icon(n.icon) + n.label + '</a>'; }).join('');
    return '<header class="site-header"><div class="wrap"><div class="header-row">' +
      '<a class="brand" href="index.html"><img src="LOGO_URI" width="34" height="34" alt="Unconventional Wisdom logo">' + CONFIG.siteName + '</a>' +
      '<nav class="nav" aria-label="Main">' + links + '</nav>' +
      '<div class="header-tools"><a class="chip" href="leaderboard.html" aria-label="Your points">' + icon('bolt') + '<span data-points>0</span></a>' +
      '<button class="icon-btn menu-toggle" type="button" aria-expanded="false" aria-controls="menu-panel" aria-label="Open menu">' + icon('menu') + '</button></div></div>' +
      '<div class="menu-panel" id="menu-panel">' + menuLinks +
      '<button type="button" data-theme-toggle>' + icon('moon') + '<span data-theme-label>Dark mode</span></button></div></div></header>';

      '<p class="muted small" style="margin-top:.8rem;max-width:32ch">Practical 30 Day devotional for Leaders and builders to learn Godly Wisdom.</p></div>' +
      '<div><h2>Explore</h2><ul>' + NAV.concat(MENU_EXTRA).map(function (n) { return '<li><a href="' + n.href + '">' + n.label + '</a></li>'; }).join('') + '</ul></div>' +
      '</div><div class="footer-bottom">&copy; ' + y + ' ' + CONFIG.siteName + '. All rights reserved.</div></div></footer>';

  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('uw:theme', t); } catch (e) {}
    document.querySelectorAll('[data-theme-label]').forEach(function (el) { el.textContent = t === 'dark' ? 'Light mode' : 'Dark mode'; });
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#171513' : '#FFFDF9');
  }

  var toastZone;
  function toast(msg) {
    if (!toastZone) {
      toastZone = document.createElement('div');
      toastZone.className = 'toast-zone';
      toastZone.setAttribute('aria-live', 'polite');
      document.body.appendChild(toastZone);
    }
    var t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    toastZone.appendChild(t);
    setTimeout(function () { t.remove(); }, 4200);
  }

  function goSignIn(next) { location.href = 'you.html' + (next ? '?next=' + encodeURIComponent(next) : ''); }

  function wire() {
    var toggle = document.querySelector('.menu-toggle'), panel = document.getElementById('menu-panel');
    if (toggle && panel) {
      toggle.addEventListener('click', function () {
        var open = panel.classList.toggle('open');
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        toggle.innerHTML = icon(open ? 'close' : 'menu');
      });
    }
    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-theme-toggle]')) applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
    function refreshPoints() { document.querySelectorAll('[data-points]').forEach(function (el) { el.textContent = Store.total(); }); }
    document.addEventListener('uw:change', refreshPoints);
    refreshPoints();
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');

    // live countdowns: any element with data-unlock-day ticks every second
    setInterval(function () {
      var els = document.querySelectorAll('[data-unlock-day]');
      if (!els.length) return;
      var expired = false;
      els.forEach(function (el) {
        var ms = Store.msUntil(parseInt(el.getAttribute('data-unlock-day'), 10));
        if (ms <= 0) expired = true; else el.textContent = fmt(ms);
      });
      if (expired) fire('uw:change');
    }, 1000);
  }

  function init() {
    var page = document.body.dataset.page;
    document.body.insertAdjacentHTML('afterbegin', SPRITE);
    var logo = (document.querySelector('link[rel="icon"]') || {}).href || '';
    var h = document.getElementById('site-header'); if (h) h.outerHTML = renderHeader(page).replace(/LOGO_URI/g, logo);
    var f = document.getElementById('site-footer'); if (f) f.outerHTML = renderFooter().replace(/LOGO_URI/g, logo);
    document.body.insertAdjacentHTML('beforeend', renderTabbar(page));
    wire();
    fire('uw:ready');
  }

  window.UW = { CONFIG: CONFIG, POINTS: POINTS, LEVELS: LEVELS, Store: Store, Board: Board, Auth: Auth, esc: esc, icon: icon, toast: toast, fmt: fmt, goSignIn: goSignIn };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

<script>
/* Devotional content: Unconventional Wisdom, 30-Day Devotional. d=day, t=title, b=body paragraphs (HTML), x=dose, m=minutes to read */
window.UW_DAYS=[{"d":1,"t":"What Is Wisdom?","b":["The scriptures didn’t give a straightforward meaning of what Wisdom can be defined as. I guess this also shows how unique Wisdom is. It takes Wisdom to know the definition of Wisdom.","Let’s look first into the general meaning of Wisdom from the dictionary. <strong>The</strong> <strong>Oxford English Dictionary says “Wisdom is the capacity of judging rightly in matters relating to life and conduct”. </strong>The scripture also describes Wisdom as the principal thing. For a thing to be termed “principal”, it speaks about its importance above many other things we call important.","<strong>If we will talk about what Wisdom is, then we must consider what Wisdom is not. </strong>Wisdom is not just knowledge or accumulation of knowledge, wisdom is not understanding only. Though all of these are attributes of Wisdom. It is not morality (being of good morals or composure), neither is it knowing good from bad or right from wrong. You can have two right things and still not be able to choose wisely.","Wisdom is not academia or being a scholar. Wisdom is not merely saying or knowing something uncommon from what others know. It can be uncommon and still not be wise. It can sound deep and still not be wise.","Wisdom in general can then simply be defined as the right and practical application of knowledge gained, the ability to apply it towards a course of action and make sound decisions . Wisdom is the end result of having knowledge; understanding how that knowledge works and practically applying it to your life.","Wisdom from the lens of God is the ability to apply the knowledge of the word of God and the person of God towards a course of action and make sound decisions."],"x":"Wisdom is not knowledge, neither is it understanding. But when you have knowledge and understand how to practically apply knowledge, you are a step ahead into gaining wisdom.","m":2},{"d":2,"t":"What Is Unconventional Wisdom?","b":["<strong>1 Cor 12:6 (TPT) - However, there is a wisdom we speak of when we are among the spiritually mature. It’s wisdom that didn’t originate in this present age, nor did it come from the rulers of this age who are in the process of being dethroned.</strong>","This kind of Wisdom is not common. And it is going to be the subject of discussion in this devotional. Unconventional Wisdom in the context of this devotional is the true wisdom that has its origin from God and is rooted in Him.","When men operate in this kind of wisdom, men call them DIFFERENT OR EXCEPTIONAL. But, at first they appear as FOOLISH because they most likely are choosing a path or making a decision they aren’t used to - most likely a path entirely different from that which people have attached their names to. Until they realize it works.","This is the wisdom that goes against the norm. The kind that isn’t self-dependent but has its total dependency on God. Imagine being told that depending on someone is Wisdom. That's the unconventionality of this wisdom. If someone is being called Wise, the natural human brain thinks “They know all things”, “they have it all figured out” and “<strong>They depend on no one for wisdom</strong>”.","But the unconventional wisdom is a kind of wisdom that originates from God and a man who will operate in it has to be totally dependent on God. If you hate the word “Dependency on God”. I think you might reconsider if you still want to go on enjoying this devotional. This devotional is for those who are willing to come to the point of dependency on God, for Wisdom especially.","Therefore,<strong> Unconventional Wisdom can be defined as the wisdom that has practically mastered the act of bringing heaven’s order to the realm of men, through daily dependency and submission to God.</strong>","<strong>Mallory Smyth defined Wisdom </strong>this way and it resonates perfectly with the kind of wisdom we are talking about<strong> - Wisdom is seeing things from God’s perspective and applying that perspective to our lives.”</strong>","You can’t predict a man who is operating in this kind of wisdom because He has access and is yielded to the Ultimate source of true wisdom. He walks in unconventional ways the wisdom of the world cannot fathom.","Those who have gotten hold of this unconventional wisdom from God don’t execute like others do. They defile the norm.","Take the case of Jesus for an example, the scripture says “If the princes of this world had known, they wouldn’t have crucified Him <em>(paraphrasing 1 Cor 2:8)</em>. What the normal wisdom was is this - “When someone dies, that’s the end of his journey. So, in their limited mind and wisdom, crucifying Him was the end. But the All-wise God in His unconventional wisdom said “That was a grand plan and never the end”. The death was just the beginning of an entire plan. And up till today, the wisdom still baffles those who are used to conventional wisdom. It never makes sense to their logical mind. They want to connect the dots, but the conventional mind that isn’t yielded to spirit is limited. But as many of us who believe, it has become the power of God and we can testify that there is a wisdom that surpasses the norm and we are beneficiaries of it."],"x":"Unconventional Wisdom can be defined as the wisdom that has practically mastered the act of bringing heaven’s order to the realm of men, through daily dependency and submission to God.","m":3},{"d":3,"t":"Is the World Foolish?","b":["<strong>James 1:14-15 - But, if you harbor bitter envy and selfish ambition in your hearts, do not boast about it or deny the truth. 15 Such wisdom does not come down from heaven, but is earthly, unspiritual, of the devil.</strong>","There is something called Earthly Wisdom and not to deny the fact, this kind of wisdom produces results too. And one thing about anything that produces results is this: “Those benefitting from it never believe or accept that there is anything better than it”.","You know when people want to joke around and they say “You cannot advise someone that is in love (in the context of romance)”. For one reason or the other, in many cases, their sense of judgment is clouded, especially if they are immature minds. You can genuinely advise them based on the signals you’ve seen and they will go ahead and report you to the partner. Then, they make you the villain in their story. Until they now finally see it themselves and be like “Oh! This person told me”. I refuse to continue on this subject matter <em>(Laughs).</em> This also sometimes applies to someone that is getting results from the wrong sources or using the wrong approach. You can’t advise them otherwise. Because they will tell you “But I am getting results”. And the truth be told, they are actually getting rewarded even in the error or folly. Getting results sometimes doesn’t equate to being wise.","The world has its own wisdom and the scripture testifies to that and they most times originate from these three sources - Their common sense, their natural knowledge and the devil. Just by virtue of being human, you have access to know the difference between good and bad. Hence, the word “Common sense”. But, it’s even a pity that common sense is no longer common in this generation because the devilish wisdom has dominated.","The scripture confirms the status of the world’s wisdom in 1Corinthians 3:18-19, it says “Do not deceive yourselves.<strong> If any one of you thinks he is wise by the standards of this age, he should become a fool, so that he may become wise. </strong>","And you might be wondering “Become a fool so he can become wise…Like really? Is it that bad? It’s actually that serious.","<strong>Why? </strong>","<strong>Because the wisdom of this wisdom is foolishness in God’s sight. </strong>What this world calls wisdom and find appealing, most at times if not all the time is foolishness when placed side by side with the Wisdom of God. So, judge what you call wisdom."],"x":"The world has its own wisdom, for a fact. But what this world calls wisdom and find appealing, most at times if not all the time is foolishness when placed side by side with the Wisdom of God.","m":2},{"d":4,"t":"Differentiate Between Unconventional and Earthly Wisdom, Pt. I","b":["<em>James 3:15 - But, if you harbor bitter envy and selfish ambition in your hearts, do not boast about it or deny the truth. 15 Such wisdom does not come down from heaven, but is earthly, unspiritual, of the devil</em>","The Earthly wisdom is full self-ambition and envy. It’s always self-seeking and that’s why it never agrees with the word “depending on God for anything”. This wisdom indoctrinates men to do only things that benefit them. It encourages selfishness and the most surprising thing is people who encourage or engage this kind of wisdom boast about it because it has been normalized. It feels good and sounds appealing. They even package it as self-help courses. But if you check the result it's producing, you will realize it’s causing more damage than help.","Wherever there is envy and selfish ambition, there can’t be godliness. And where there is no godliness, there is chaos and every form of evil practice.","Don’t be surprised at what people call wisdom in this generation. It all started from selfish ambition; Wisdom that tells you to live only for yourself, prioritize self and even when you are going to live to help others, it should be because of what you can stand to gain.","Wisdom that instructs you to build a community not necessarily because you genuinely have the heart to see others grow or possibly even see them win more than you, but because you just need them to climb your ladder of success. You need them to worship you and fuel your ego, making you feel like a god.","<strong>How can you know if you are operating in earthly wisdom?</strong>","There are many ways to check but one I’ll talk about is this: When the motive behind everything you do is for self. Self seeking, self-glorifying, no regard for God’s purpose in it. On the outside it might look like you are helping people, but deep down, you know you are just using them to crush your goals and tick your boxes."],"x":"The Wisdom that tells you to live only for and prioritize yourself is Earthly. It says, even when you are going to live for others, it should be because what you stand to gain is Earthly. Earthly Wisdom is selfish and self-ambitious.","m":2},{"d":5,"t":"Differentiate Between Unconventional and Earthly Wisdom, Pt. II","b":["<strong>James 3:17 - But the wisdom that comes from heaven is first of all pure, then peaceloving, considerate, submissive, full of mercy and good fruit, impartial and sincere </strong>","Yesterday you read about the Earthly Wisdom and few of its characteristics. Today, we’ll continue by looking at how The Unconventional Wisdom (Godly) stands out from the earthly wisdom.","One of the main characteristics of the earthly wisdom is SELF; It is self-seeking and takes glory in being independent of God (either loudly or subtly by actions). But The Godly Wisdom on the other hand, has its origin from God. Because God is pure, this wisdom is pure and without guile. Because God gives out of love, godly wisdom gives out of genuine love.","A man who operates in this Godly wisdom we are talking about considers the interest of others in whatever He does, while putting God first. He cares about what is in for others and not just himself alone.","Godly wisdom produces fruits that aren’t alien to God. Because a good tree will most likely not produce a bad fruit. Only bad trees produce bad fruits.","James said in <em>James 3:1</em> and I quote “Who is wise and understanding among you? Let him show it by his good life, by deeds done in humility that comes from wisdom.","How you can differentiate the Godly wisdom from the Earthly wisdom is that “Godly Wisdom originates from God doesn’t alienate God. It produces the kind of fruits and deeds that God can produce because it is rooted in, totally dependent on and not separated from God”. If God is not selfish, that means His wisdom cannot be selfish. If God is all-wise, that means His wisdom encompasses all things and cuts across all areas of life."],"x":"Godly wisdom produces fruits that aren’t alien to God. Anything that cannot be found in God cannot be found in it. So, if YOU claim to have Godly Wisdom and the fruits or results of that wisdom are alien to the ways of God. Check that wisdom.","m":2},{"d":6,"t":"Wisdom as the Foundation of Creation","b":["<strong>Prov. 8:29c-30 - …and when He marked out the foundations of the earth. Then I was the craftsman at His side.</strong>","The day I saw this scripture, I understood better why gaining Godly Wisdom is truly important. And the reason why the world’s wisdom in all of its explorations can be called nothing but foolishness when compared to it.","When you look at the earth in all its beauty and splendor, sometimes it even raises questions in your heart and you’ll be like “Why is the sun hanging somewhere up there? How did we even get here? What exactly happens in the womb before a fetus can become a whole baby?","There’s an ancient wisdom that was before the world began (Prov. 8:22). When God wanted to start the work of creation, do you know what He did? He created wisdom first.","Then, he allowed wisdom to do the work of craftsmanship (Prov. 8:30). All He just needed to do afterwards was give commands “Let there be…”(Gen 1:3) And Wisdom goes on with the craft. If Wisdom could craft out the world, it says something about Wisdom and creativity you need to pay attention to.","How the world came to be and the different evolutions that have happened aren’t alien to Him. If you think about it deeply, this Wisdom is looking like it has a personality - He can actually sit and craft. It goes beyond an abstract thing you just sense or feel. It shows there’s a lot to unpack in God’s Wisdom and what you think you have access to is little compared to what you can enjoy in God. Imagine, having a partnership with this Wisdom that has been even before the world was created.","I’m not an advocate for seeking things that go beyond what you can handle or seeking the mysteries that no one has unpacked, just out of untamed curiosity. Even Wisdom helps you know the kind of mysteries to seek and those you don’t have business with (I explained this better in the one of the next doses). But, all I want to emphasize to you in today’s read is that The Wisdom from God is the best partner and foundation you can have if you want to create things that outshine the world’s wisdom and benefit humanity."],"x":"The revelation of God’s wisdom is progressive. The highest of God’s wisdom you have enjoyed before is the least you can enjoy. There is depth and riches in the wisdom of God. Be hungry for more! But. allow wisdom to guide your hunger so you don’t land in places you don’t have any business with.","m":2},{"d":7,"t":"Jesus Christ: The Wisdom of God","b":["<strong>John 1:2-3 NIV - He (Jesus) was with God in the beginning with God. Through Him (expressed as Wisdom) all things were made; without Him nothing was made that has been made. (</strong><em>Words in the brackets emphasized by me)</em>","The main writer of Proverbs who has been acknowledged to be the Wisest man on earth (and no one has been able to break his record, save Jesus). Solomon, one of the wealthiest kings that ever existed, testified of Wisdom as the craftsman that sat with God during the creation of the world.","Another testimony came: John 1:2-3 - A Word that was with God in the beginning through which all things were made and without Him nothing was made that had been made.","And remember yesterday we talked about Wisdom being the craftsman that was at God’s side from the beginning (Prov 8:22, 30).","You will realize Solomon wasn’t describing Himself in Prov. 8, he was describing something He has fellowship with. If there was anyone that could tell us about Wisdom, I think Solomon is in the best position. The testimony of John also buttressed what Solomon has described Wisdom to be. Are you thinking what I’m thinking?”","All these points to the fact that “We cannot separate the subject of Wisdom from its true meaning”. CHRIST IS THE WISDOM OF GOD. The revelation of who Christ is brings us into the Wisdom of God.","God uses the Foolish things of this world to confound the wise. The life of Jesus and how everything played out was one of those foolish things. But see what God made out of what seemed like foolishness to men. It became our SALVATION, our POWER.","If you have tasted the other side and you genuinely encounter Jesus, you can testify to this “THERE'S SOMETHING ABOUT GENUINELY ENCOUNTERING JESUS”. It makes so much difference that is unexplainable. My Life is a Testament. I wonder what I would have been doing with my life now if I didn't truly encounter Jesus. Probably someone just going with the flow and rhythm of the world, not being able to decipher what is Wisdom from what is going to ruin me.","Imagine how a virgin could give birth? Imagine the crucifixion of Christ which they thought was the end? Human wisdom even expected Christ to come from a royal and very powerful background but the entirety of the coming of Christ to the world disrupted those who attribute Wisdom to logic, to what makes sense only in the head. It rendered logical reasoning useless and came in a way that surpasses natural wisdom."],"x":"The revelation of who Christ is brings you into the WISDOM of God. If you genuinely find Jesus, you've found the Wisdom of God.","m":2},{"d":8,"t":"The Beginning of Wisdom","b":["<strong>Prov. 9:10 (NIV) - The Fear of the Lord is the beginning of Wisdom; the knowledge of the Holy one understanding</strong>","The passage above is one of the most-popularly quoted scriptures and yet the understanding of it is lacking. Another passage says “The Fear of the Lord, that is Wisdom…”<em>(Job 28:28)</em>. I’m in awe because the Word of God just made us understand now that, <strong>all you are trying to do legally come into wisdom, is fulfilled in this one thing - “To Fear the Lord”.</strong>","There is no point talking about unconventional wisdom if this passage “Proverbs 9:10” will be sidelined. If we say something is the beginning of a thing, do you know what it means? It means the other cannot exist if this hadn’t existed.","True wisdom cannot be gained outside of the fear of the Lord. <strong>For this <em>Unconventional Wisdom </em>we are talking about, the fear of the Lord is the starting point</strong>. To walk in wisdom, is to reverence the giver of wisdom. You don’t treat Him like one distant boss you don’t have access to. You don’t treat Him like a side project. You don't treat him as someone you seek their opinion when everything has gotten to the verge of scattering.","<strong>What does it really mean ” To Fear The Lord”?</strong>","One passage that gives an insight into it is this: Trust in the Lord with all your heart, do not lean on your own understanding. In all your ways acknowledge Him and He will make your paths straight <em>(Prov. 3:5)</em>","It is a conscious decision you make where you now say “I might have an understanding, but I embrace yours. I might have knowledge, but I acknowledge you in it”. To fear the Lord is to revere Him, to acknowledge Him and His words. You take Him at His words and not trivialize His words.","<strong>To Fear the Lord is to acknowledge Him as a higher authority over you and believe in His supremacy.</strong> For in him you live, move and have your being. Without him, there's literally NO LIFE. Let's not take it far. Think about the breath in your nostrils as the first example of Life.","<strong>Wisdom starts from acknowledging the superiority of God’s word over your own opinions.</strong> It starts from knowing God and His beautiful ways - because He created wisdom and wisdom originates from Him.","It’s just similar to you wanting to access how Anthropic developed Claude AI, but you decide to bypass the founder.","When you try to find Wisdom outside of God, what you get is earthly wisdom, common sense and twisted truth.","<strong>To fear the Lord, that’s the first step to living a life of Wisdom</strong>. But to fear Him is not equivalent to knowing Him. There’s a further step to be taken; which is coming into the knowledge of Him [The Knowledge of the Holy one is understanding…<em>Prov. 9:10]</em>."],"x":"Unconventional Wisdom begins with Reverence for God. Reverence brings you into the knowledge of Him, then understanding of Him plus obedience to HIs precepts form True wisdom in you.","m":2},{"d":9,"t":"Getting Wisdom","b":["<strong>Proverbs 4:7 (KJV) Wisdom is the principal thing. Therefore get Wisdom. And in all your getting, get understanding. </strong>","<strong>James 1:5 (NKJV) - If any of you lacks wisdom, let Him ask God, who gives to all men liberally and without reproach, and it will be given to Him. </strong>","God is willing to disburse Wisdom to men. He gives freely, but not anyhow.","God gives His wisdom to all men but there is the right heart posture to receive. Let’s check Solomon, the wisest man as a case study. Solomon had the privilege to ask for power, wealth and riches, but he asked for Wisdom. It takes a man with the right heart posture to delay gratification the way Solomon did. He knew the importance of Wisdom and that every other thing He could ever ask for is embedded in Wisdom. Though it might not come instantly.","It’s similar to receiving salvation. As much as salvation is free and for all men, you have to believe and confess with your mouth the Lordship of Jesus. Wisdom also works similarly. You have to love Wisdom, desire it and want more than just the conventional.","Wisdom comes to those who love and seek her <em>(Prov. 8:17)</em>. Wisdom comes to those who acknowledge they lack it and then proceed to ask God <em>(James 1:5)</em>","Unconventional Wisdom doesn’t dwell with those who already think they know. If you desire Godly Wisdom, that is, this Unconventional and true Wisdom we are talking about, then you will have to ask with your own mouth. Wisdom cannot be impacted by a man, it is given to those who seek and can steward it.","But when you ask, you must believe and not doubt, because he who doubts is like a wave of the sea, blown and tossed by the wind. That man should not think he will receive anything; he is a double-minded mind, unstable in all he does <em>(James 1:6-7).</em>","Wisdom comes with a lot of family members like I have previously mentioned. It attracts many other good things and it takes a man who has yielded to God to steward them rightly without destroying himself. This again is why the subject of the fear of God cannot be separated from the topic of Wisdom."],"x":"God is willing to give wisdom freely to all men, but you must be willing to receive. LOVE wisdom, SEEK wisdom, ASK GOD for wisdom.","m":2},{"d":10,"t":"Attributes of a Wise Man","b":["<strong>1Kings 3:7 - “Now, O Lord my God, you have made me king instead of my father, David, but I am like a little child who doesn’t know his way around. NLT </strong><em>(Heart posture)</em>","<strong>1 Kings 3:9 - So give your servant a discerning heart to govern your people and to distinguish between right and wrong. For who is able to govern this great people of yours? NIV </strong><em>(Humility to acknowledge his need for God)</em>","If we were to list these attributes the conventional way, we can go on and on just listing all the moral behaviours that are widely acceptable in the society. But that's not it.","While writing this part, the Holy Spirit directed my attention to use Solomon as a case study, portraying two core attributes of A Wise Man. The Lord after choosing Solomon and committing His agenda into Solomon's hands required him to ask for whatever He wanted God to give him. The agenda: to rule God's people and lead them to Him.","Solomon's request and words revealed a lot. Two of which are stated in the two Bible passages above. You can read through 1 Kings 3:7-9 and meditate on them. Solomon said and I paraphrase “You have given me this, but I acknowledge I'm but a child. I can't do this without you. I don't have the wisdom to run this on my own”.","<strong>Solomon portrayed an Attribute that is becoming rare amongst us in this generation - HUMILITY as an heart posture. </strong>Solomon could have easily banked on the doses of wisdom his father David had administered to him before his death, he could have banked on what he had seen work in David's time, he could have copied verbatim and felt confident in himself enough to lead the people. But he said <strong>“I am like a little child… </strong>He might not even be a little child by age, but humility is a heart posture. <strong>It takes a humble man to acknowledge the need for help regardless of age.</strong>","<strong>Another core attribute I believe covers for every other aspect is what Solomon asked for - A DISCERNING HEART.</strong>","This thing called discerning heart is core. It is a core attribute for a wise man. God in the awesomeness of His wisdom didn't walk with Solomon the exact way He did with David. Yet, both of them were wise and did extremely great things for God. Imagine Solomon wasn't discerning and just decided to go with David's way, he would have done well in being an exact copy of David and not tap into the Unconventional route God wanted to take him through in their journey together.","Life is in phases. We are faced with different situations in life that we aren't even prepared for. A Discerning Heart is key to navigating life with wisdom. Every other attribute is connected to this. A Discerning heart helps you know when to act innocent, when to be shrewd, when to be slow in action, when to strike with speed, when to go all out, when to lock in, what instructions to discard no matter how well-meaning they are and to know the voice of instruction (in men and by spirits) to listen to.","<strong>A Discerning Heart! </strong>Solomon said “Give your servant a discerning heart…to <strong>distinguish between right and wrong</strong>, and I add <strong>“...to distinguish between good and God. </strong>Because sometimes, it's not a question of “right and wrong”, it is a question of “Is it just right or is it what God wants?” A discerning heart fetches you an answer.","<strong>As you read this today, I want you to take an actionable step immediately:</strong>","If you are already walking in this gift of A Discerning Heart, I want to say a word of prayer “Holy Spirit, fan this gift into flame in me. Increase the intensity so I can be more discerning”. Heighten the level of my discernment.","If you've never really seen a need for a discerning heart or has never experienced what it means except for now that you are reading this, I want you to do this:","<strong>Say this “Holy Spirit, give me a discerning heart. I can’t know it all by head knowledge. Bless me with a discerning heart so that I can walk in unconventional wisdom”.</strong>"],"x":"The core attributes of A Wise Man are: Humility (as a heart posture) and A discerning heart. Every other attribute builds on this.","m":4},{"d":11,"t":"Wisdom in Character","b":["<strong>Prov 8:12-13 - I, wisdom, dwell together with prudence, I possess knowledge and discretion…I hate pride and arrogance, evil behaviour and perverse speech. Counsel and sound judgement are mine; I have understanding and power.</strong>","It saddens my heart to see young people, leaders, builders and professionals, occupying a certain space for Jesus (either as a Leader, pioneer or supporter), full of fire and anointing and when you come in close contact, you will be shocked, because their character is the exact opposite of what they teach or preach.","I know we are not perfect, by human definitions. I'm not either. But I believe we all should actively work towards perfection and we can always tell when someone genuinely wants to grow or when they've become full of themselves and adamant to corrections.","<strong>If you and I speak in the tongues of men, have oratory prowess and can even speak in the tongues of angels and have no LOVE, we are just but a resounding gong or a clanging cymbal. </strong>That is, our impact and contributions are nothing but noise.","I have realized that the basis of everything we do is <strong>LOVE. </strong>To leave an indelible mark in people's lives and influence them the right way, LOVE is required. You can't serve “<strong>GENUINELY</strong>” people you don't love. Remember I emphasized “genuinely”. It takes compassion rooted in Love to see a set of people, bear their pains and want to do whatever to help them out of it. Jesus exemplified this kind of Leadership.","<strong>Maybe the reason you want to work for God and identify your brand with Jesus is just so you can gain influence and feel among. Check your motives.</strong>","Because if you are truly yielded to Him, you will want to be like Him in character, in words and in ways. Not just when you are in the limelight.","<strong>Maybe your motive for wanting to be a Leader is to just become influential and use others as a Ladder to achieve your own goals, not genuinely to see their lives change. Scrutinize your motive. </strong>Because what you're building might not be able to stand the test of time.","If we all can get the basics right, which is carrying the consciousness of LOVE, it shapes every other thing we do. It refines our character.","If you love God, you will want to fellowship with Him and obey His commands.","If you love others, you won't do to them what you can't tolerate.","If you love God and others, you won't always prioritize things that will benefit you alone. You won't be self-seeking.","If you have Love, you'll be kind, patient, humble. You won't seek only things that benefit you, your mantra won't be: “So far it doesn't affect me, I don't care what others feel or think”. You won't boast, be proud or keep records of wrong. You'll be quick to listen and slow to speak or get angry. <strong>You won't only respect people that can offer you something</strong>. You'll give people grace and have hope (see potentials) in them. And in doing so, character will be formed in you.","This is unconventional wisdom, not the kind of wisdom that says “Do only what benefits you”, “Go for only what makes you feel good without putting others into consideration”."],"x":"LOVE is foundational to coming into the character of Wisdom. Love compels you into wise character.","m":3},{"d":12,"t":"Wisdom in Action","b":["<strong>James 3:13 (NIV) - Who is wise and understanding among you? Let them show it by their good life, by deeds done in humility that comes from wisdom.Prov. 4:5 - </strong>","You can never separate Wisdom from Acts.","We don’t know a wise man by what he says alone, but by what he does. A man is not wise because he calls himself so (not even in a world where everyone now has access to information). Anybody can talk, but wisdom is proven by her actions.","A Wise man is not eager to teach what He is not willing to practice. Certain teachers who themselves have not enrolled in the school of wisdom are those who usually say “Do what I say, but don’t do what I teach”. Some don’t even say it, but their lifestyle screams “Do what I say, but don’t do what I do”. True Wisdom on the other hand will confidently say “Do what I do”.","Your life; most especially your words, must align with your actions. This is one of my anchor scriptures when it comes to taking actions. It is what James wrote to the 12 tribes, he said “<strong>Do not merely listen to the word and so deceive yourselves</strong>. Anyone who listens to the word but does not do what it says is like a man who looks at himself in a mirror, goes away and immediately forgets what he looks like…<em>James 1:22-24</em>. (Take a pause and picture that).","Wisdom is not known by knowledge alone, but by your actions birthed from understanding. The Wisdom of God teaches your hands diligence not laziness. Because Wisdom himself was the craftsman at creation. With diligence and creativity crafted the earth and all that is within it <em>(Prov 8:30).</em>","If you store up knowledge and never act on them, it never results in wisdom. Wisdom reflects in your deeds, because out of the abundance of Wisdom in you, your deeds speak."],"x":"Wisdom goes beyond just knowledge, it transcends to understanding. From understanding to taking the right actions. Wisdom is proven by actions. Wisdom is knowing what to do and doing it.","m":2},{"d":13,"t":"Wisdom in Action, Pt. II","b":["<strong>James 1:5 - But the man who looks intently into the perfect law that gives freedom…and continues to do…not forgetting what it says will be blessed by what he does.</strong>","If you now know from the scriptures that Wisdom is a craftsman, what are you doing with that knowledge?","If you know that walking in Wisdom starts with acknowledging God, reverencing Him and choosing to partner with Him, what are you doing with that knowledge?","Don’t claim to know God and deny Him by your actions. Wisdom gives you the ability to not just know a thing, but understand it enough to use it in benefitting others, make sound judgement and take the right actions.","Don’t be ever learning, but never coming into the knowledge of the truth. Show me your wisdom without actions, I’ll show that what you've only acquired is head knowledge.","Faith produces deeds! Deeds produce results! Results produce Track Record! And Track Record solidifies your Faith!","David said <strong>“Your servant has been keeping his father’s sheep. When a lion or a bear came and carried off a sheep from the flock, I went after it, struck it and rescued the sheep from its mouth. When it turned on me, I seized it by its hair, struck it and killed it.” </strong><em>(1 Sam. 17:34). </em>This track record made David believe so strongl
