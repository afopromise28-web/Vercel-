y that he could defeat Goliath.","Remember, <strong>there's no track record without taking the first step of Faith. Note that I Said of FAITH not of Self-acclamation.</strong>","It is a step of Faith because God said it and he is instructing you to move in that direction. It is not a step of Faith just because you want it at all cost (even when God is saying otherwise)."],"x":"Wisdom is proven by her actions. What are you doing with what you know? Wisdom is knowing what to do and doing it.","m":2},{"d":14,"t":"Wisdom in Words","b":["<strong>Titus 2:7-8 (NIV) -...in your teaching, show integrity, seriousness and soundness of speech that cannot be condemned, so that those who oppose you may be ashamed because they have nothing bad to say about you <em>(Emphasis: mine)</strong></em>","Words are the content of Wisdom. And True Wisdom finds her root in God’s word. Words are channels that can lead a man’s heart somewhere - either lead it to life or lead it astray. Words can truly motivate. Even the words spoken from common sense can make people feel good for a while. But, the words that transform humans and make their lives better cannot but trace back to its origin is God.","Learning Public speaking without wisdom is digging your path to amplifying your foolishness to the world someday.","Focusing on better presentation while neglecting the contents of the word is likened to beautifying the fences of your house without beautifying your rooms.","<strong>In your teaching</strong>,<strong> show…soundness of speech that cannot be condemned</strong>,<strong> so that those who oppose you may be ashamed because they have nothing bad to say about you</strong> <em>Titus 2:7- 8</em>","Can you read that line again “<em>show…soundness of speech that cannot be condemned, so that those who oppose you may be ashamed because they have nothing bad to say about you?”</em>","Your teachings should be seasoned with so much wisdom and almost have nothing that can be condemned in it.","As you are building community and sharing your process, impacting young lives and all sorts, never forget this. If people are ever going to drag you online, let it be because of the truth you stood for and was never willing to compromise. Let it never be because of one foolish thing you said, that the Holy Spiirt himself is even convivting you of and you are yet justifying it.","The truth is you cannot totally control what people's response should be to whatever you share or teach. But never give them room to be justified. Let it be that they didn’t agree because they found it controversial, but not because it was folly.","Let’s take the case of Daniel as an example.","<strong>Daniel 6:4 - </strong>At this, <em>the administrators and the satraps tried to find ground for charges against Daniel</em> in his conduct of government affairs, but <em>they were unable to do so</em>. <em>They could find no corruption in him</em> because he was trustworthy and neither corrupt nor negligent.","Daniel was involved in government affairs and these people wanted to find charges against him just to bring Him down, they found nothing - as in nothing. Not even his words? Not even his speech? Nothing! Except for his love for God. If you read it downwards a bit to verse 5. Daniel showed us possibilities, that you can be wise even in your speech and people will come for you with the aim of bringing you down, but they will find nothing except for your love for God."],"x":"Words are the content of Wisdom. True Wisdom finds her root in God’s word. Show soundness of speech that cannot be condemned in all you do, so that those who oppose you may be ashamed because they found nothing to condemn you for except the fact that you love God.","m":2},{"d":15,"t":"Words of Wisdom and Folly","b":["<strong>Prov. 9:4 - “Let all who are simple (simple-mindedness not false humility) come in here!</strong>","<strong>Prov. 9:13 - The woman folly is loud, she is undisciplined and without knowledge.</strong>","Wisdom speaks “worthy, right, just and true”. But folly speaks “lie, wickedness, perverse and crooked words., void of grace yet presented as ‘True’.","How then can we differentiate between the words of wisdom and folly?","<strong>Wisdom says “Let all who are simple (simple-mindedness not humility) come in here!...Prov. 9:4.</strong>” This was an invitation to bring those who have been living without wisdom (the simple) to wisdom. Wisdom invites others to Life and what makes them better. One of the ways we can know a wise man is by the kind of instructions he listens to. And the kind of instructions he listens to has a great influence on the kind of instruction he will also give.","If the wisdom of God is the one instructing you and influencing your thoughts, what comes out of you is life and health to others. This is again why reverence for God cannot be excused from the subject of Wisdom.","<strong>Listen to what Folly has to say to her audience</strong>. Folly is what can be represented as Earthly Wisdom in this sense. <strong>She tells her audience “Stolen Water is sweet and food eaten in secret is delicious…(Prov. 9:17)”</strong>. When they hear it, they are excited and they even shout “deep”. It looks like wisdom actually, it sounds different from what they would normally hear. And this is where people miss it. <strong>Just because it sounds deep or different from what you are used to, doesn’t mean it’s wisdom</strong>. If it doesn’t find its root in God, it is still foolish.","What looks like wisdom to them was actually an invitation into destruction. She was inviting them into fornication, death and the depths of the grave. <strong><em>Prov. 9: 17.</em> </strong>Little do they know that the dead are there, that her guests are in the depths of the grave.","Wisdom on the other end was inviting them to Life."],"x":"The Words of Wisdom invites others to Life while Folly disguises as Life but digs the grave of destruction for those who listen to her words.","m":2},{"d":16,"t":"Wisdom in Knowledge Seeking","b":["<strong>Prov. 18:15 (ESV) - An intelligent heart acquires knowledge, and the ear of the wise seeks knowledge.</strong>","<strong>Prov. 19:2 (ESV) - Desire without knowledge is not good, and whoever makes haste with his feet misses the way.</strong>","Consumption of knowledge alone doesn’t equate wisdom, though it can aid it. Knowledge in itself is a tool that can make or break you.","Have you ever learnt something new probably while reading a book or taking a course and suddenly feel more knowledgeable than others, or even start to see them as ignorant and can’t listen to them anymore? It happens. This is one of the things knowledge can do to an untamed man.","In knowledge seeking, wisdom tells us to go for the right knowledge based on occasion and demands. Not all kinds of knowledge.","Am I saying you should be air-headed and never go for knowledge? No. What we are learning is acquisition of the right knowledge and avoiding knowledge that can mar you or your knowledge of god.","<strong>Avoid knowledge that can mar you.</strong> Avoid the one that attacks your dependence on God and faith in his words. Avoid the one that makes you think you don’t need God to figure life out.","1 Corinthians 8:1 …<strong>we know that “all of us possess knowledge”</strong>. <em>This knowledge puffs up. Then, Prov.2:6 For the Lord gives wisdom, from his mouth comes knowledge and understanding </em>","In knowing, many of us know a thing. You know something, no argument. But, this same knowledge that you have can puff you up and make you become so confident in yourself and abilities. Whereas, you are being given in the real sense. True knowledge that can make you comes from the mouth of the Lord, from his words. Any knowledge that cannot trace its origin back to God’s word verbatim, the teachings of His spirit, or probably from the natural principles he has laid down, doesn’t really mean so well for you. Check it, it never produces life."],"x":"Don't be an air-headed Leader or builder. Seek Knowledge, desire knowledge, inquire for knowledge. Wisdom is now needed to discern between the knowledge that can make or mar you. Any kind of knowledge that doesn't have its root in God will mar you.","m":2},{"d":17,"t":"Wisdom to Build, Pt. I","b":["<strong>Heb. 3:3 - …the builder of the house is more important than the house itself. For every house is built by someone, but God is the builder of everything.</strong>","You are more important to God than every project He has given you or will give you to build.<strong> YOU ARE THE FIRST PROJECT </strong>and God is able to trust you with other projects because you have first allowed Him to work on you as a project. Don’t be so engrossed in the projects while neglecting the truth that you are the first project he delights in building.","<strong>DDK (Debola Deji Kurunmi) said something and it stayed with me up till now.</strong> She said <em>“Don’t desire to conquer territories for the Lord when you haven’t first become the territory He conquers”.</em> That’s profound!","You must come to the understanding that God doesn’t rate men based on the work and more work they can do. Your identity isn’t first about what you can do but what He did for you. It is in response to what He did that you can now do. If Christ never did anything, all the work, building and kingdom advancement we are trying to do would have amounted to self-righteousness.","<strong>If God is the builder of everything, and the builder is more important than the house itself (now from the second context), </strong>then He deserves your attention more than the project He has given me you to build.","Any project you are building that can compete with the place of God in your heart, check it! That thing might be taking your worship and that’s not the mind of God for building.","<strong>The order:</strong>","- <strong>The builder of the house builds you first and continuously does.</strong>","- Gives you project(s) to build with him as the foundation.","- You allow the project stand firm and deeply on the right foundation He has laid for you.","<em>A building without a firm foundation will soon collapse at the slightest of rain.</em>"],"x":"YOU ARE THE FIRST PROJECT that God is so delighted in building before committing projects into your hands. Every assignment He has given you is an opportunity to grow.","m":2},{"d":18,"t":"Wisdom to Build, Pt. II","b":["<strong>Luke 14:28 - Suppose one of you wants to build a tower. Won’t you first sit down and estimate the cost to see if you have enough to complete it?</strong>","<strong>Gal 3:3 - Are you so foolish? After beginning with the spirit? Are you now trying to attain your goal by human effort?</strong>","You prayed for ideas, a vision, an identity in Him. The idea came or He revealed your identity to you and the next thing you want to do is announce on Social media and start prepping your audience just to impress them. You haven’t first sat down and counted the cost. You didn’t even remember to ask again “How do you want me to execute?”","If the spirit initiated the idea or prompted the vision, then the strategy for execution still lies with Him. This doesn’t mean you don’t have a part to play anymore. After all, you are still the one who will execute it and how well it will be executed depends on you. But, the Holy Spirit (finding expression as Wisdom) is capable of giving you instructions and guidance on how to execute rightly.","When He gives you an idea to build on, your first action should not be to Start running. Running without knowing how best He wants you to execute is dangerous. Be diligent enough to receive it completely. He has the execution template. Well, this is with an exception of the overthinkers like Gideon - whom after they have received the instruction, the backing of God through His word will still ask “Lord, are you sure? Give me a sign to convince me.”","Let the one who started it guide you. Don’t be too quick to assume you know what to do next. In a world where we are advised to take action immediately at all times, I know this might be a hard pill to swallow. But the word of God says “Count the cost”. Be wise enough to know when to strike and when to delay gratification. And if the world didn’t give you the assignment, they can’t determine when you should execute.","So, if you claim the Spirit of Wisdom initiated it, then you must learn to allow Him lead the journey all through - from ideation to execution."],"x":"When you receive an idea, instruction or vision, sit down and count the cost. This is not time-specific. Be wise enough to know when to act urgently and when to delay gratification.","m":2},{"d":19,"t":"Wisdom to Build on the Already-Laid Foundation","b":["<strong>1 Cor. 3:10 <em>NIV </em>- By the grace God has given me, I laid a foundation as a wise builder, and someone else is building it. But each one should build with care.</strong>","<strong>1 Cor. 3:11 <em>NIV </em>- For no one can lay any foundation other than the one already laid, which is Jesus Christ.</strong>","When I started writing this devotional in March, I hadn't really gotten a hold of what today's topic really meant. The theme “Building on the Already-Laid Foundation “ means a lot of things. But, I learnt a dimension of it by experience<strong>. </strong>The Lord had to teach me this himself.","I love to move and constantly be in a motion - You know as per MOVING MAN as everyone has been calling themselves in the online space now. I'm not afraid of moving, but I'm afraid of moving in the wrong direction that doesn't align with God's plans for me.","The days of ignorance can be easily overlooked. The days of feeding on milk as babes in Faith. God could have easily overlooked moving in the wrong direction and it can be counted as “Oh! She didn't know”. But how about the part where “He has trained you, he is training, made you a Son and conferred you with responsibilities”. He has stated clearly what is required of you and what He desires to make out of you. But yet you decide to move in the wrong direction?","God, as a loving Father, will still show mercy and re-route you back to the right path. But I don't think that will be without discipline. Because you actually know better and you aren’t doing it. The discipline isn't a result of hate, but a way to shape your heart posture to become more like Him - to become a son indeed!","<strong>After starting the devotional and already sharing a glimpse of the launch online, He took me into a season of quietness. A season of stillness. A season of learning (by experience). I think this season really did a lot to my heart and shaped my willingness to want more of Him in all humility, not just for what people can see.</strong>","<strong>What is the Already-Laid Foundation?</strong>","<strong>1 Cor. 3:11 <em>NLT</em>-</strong> For no one can lay any foundation other than the one we already have—Jesus Christ.","<strong>2 Tim 2:19 <em>NLT</em> - </strong>But God’s truth stands firm like a foundation stone with this inscription: “The Lord knows those who are his and All who belong to the Lord must turn away from evil (<strong>folly</strong>)<strong>.</strong>","There's an approach to building in God's kingdom. It is this: God is of more priority than any assignment. Every assignment is to the end that Jesus is revealed. If what He wants you to build is of greater significance to you than Him. Your priority is misplaced already. He loves to work with those He can entrust things into their hands. He knows those who are His and those who are His are completely yielded to him."],"x":"Every Assignment he has given you has an end goal - That Jesus is revealed and glorified. This is the already-laid foundation. Build on it.","m":3},{"d":20,"t":"Wisdom to Get Wealth, Pt. I","b":["<strong>Deuteronomy 8:18 <em>NIV</em> - But remember the Lord your God, for it is He who gives you the ability to produce wealth, and so confirms His covenant…</strong>","Let's set the path straight again; this devotional is for those who want to gain wisdom as it applies to every aspect of their lives, but the unconventional way. It is Unconventional Wisdom because it is not the common wisdom widely accepted by the world, but it is God's standard.","<em>…for it is He who gives you the ability to produce wealth…</em>","As someone whom the Lord had committed a portion of assignment into your hands, you need to see this scripture in the light that God sees it. The Lord has opened your heart to bear some certain burdens in His heart, He has placed you as a Leader to serve a certain people, He has committed ideas into your hands that He wants to birth to life through you but you haven’t reckoned with His words concerning Wealth. You are still struggling to sit comfortably in discussions when they switch the topic to wealth, then you need to start from that foundation level.","Get into the word, soak yourself into the passages where God has spoken about Wealth. Learn about wealth from God's perspective. And this is one of the things this devotional is doing for you.","If you don't see the need for wealth or understand what God has said about wealth, then everything I am saying here might not make complete meaning to you. But because you haven't come into the light yet doesn't mean God hasn't promised it or made it available for you. Reckon with this first.","But just like Paul said and I paraphrase <strong>“I know what it means to be in need and what it means to have abundance, but in all of these I have learnt contentment and neither lack nor plenty affects or predicts my love for God”</strong>. That's the balance. Wealth is not what qualifies you for the assignment or shows that God is happy with you. But, wealth is one of the promises that accompanies the assignment. Never join them in arguing on the topic of “Whether God wants believers to be wealthy”. Read the scripture for yourself and see His promises."],"x":"God promised wealth and He also gives to those who are His the ability to produce wealth.","m":2},{"d":21,"t":"Wisdom to Get Wealth, Pt. II","b":["<strong>Deut 8:18 </strong><em>(NIV) </em>- <strong>But remember the Lord your God, for it is </strong>He who gives you the ability to produce wealth, and so confirms His covenant…","<strong>Let's talk about the ability to produce wealth. </strong>","One thing that humbles my heart about this topic of wealth creation is the fact that some strive and do all it takes to get wealth legally with their own knowledge and strength. They apply all the principles of Wealth creation that the world acknowledges and they get it. And some don't, even though they put in the work.","Another set go through the illegal route, they cheat others in order to amass wealth, they get it but never enjoy it.","Then, God said to those who are yielded to Him and have learnt His ways. He said, “This is Wisdom: Follow my commands, listen to my instructions, <strong>I DERIVE PLEASURE IN GIVING WEALTH THOSE WHO DEPEND ON ME FOR THE ABILITY TO PRODUCE WEALTH”.</strong>","Which category do you belong to? Which category would you rather be? I'd rather you be in the third category even if it means letting go of independence. I will be wealthy and I won't still have to strive for it. The power to produce wealth, the strength to take the right actions will be given. I won’t have to figure it out alone. I'd rather be in this category. It is likened to your boss sending you on an errand and still providing a vehicle that will take you there.","Would you love to strive and be spent to become wealthy even at the expense of losing your soul or would you love to be strengthened and enabled to produce wealth even if it means letting go of self-dependence?","<strong>We know the principles of Wealth creation and we apply them. But, we don't limit Him to principles that can work for anybody</strong> (either yielded or not) because they are fixed laws of nature.","We have an advantage. We don't strive. He gives us the power to produce wealth; He leads us to the right investments, He gives us the right ideas to execute, He opens our eyes to the right problems to solve and even creates demands for our sake.","<strong>The topic “Wisdom to Get Wealth” is not for lazy people.</strong> If you think I'm saying the third category of people don't work and everything just comes to them. You need to read it again.","Let's read this together. Read it aloud if possible. <strong>“LAZY HANDS MAKE A MAN POOR, BUT DILIGENT HANDS BRING WEALTH”, <em>Prov. 10: 4.</strong></em>","Let's continue tomorrow where we will talk about Wisdom and Diligence."],"x":"Recognize your Wealth advantages in God and start leveraging them. He gives the ability to produce wealth and so HE has placed these abilities in us. Ask the Holy Spirit to help you recognize yours if you haven’t yet.","m":2},{"d":22,"t":"Wisdom and Diligence","b":["<strong>Prov. 10:4 - Lazy hands make a man poor but diligent hands bring wealth.</strong>","I was saying yesterday that the discussion about “Wisdom to Get Wealth” isn't for lazy people. <strong>Remember, being Lazy is different from Waiting on God or not taking a step yet because He hasn't commanded you to.</strong>","Being Lazy and Trusting God are two different things. But many at times, lazy people camouflage their laziness as trusting God. One of the ways to know if you are lazy is when God has committed a project into your hands, given you an idea and a sense of urgency the idea carries but you chose to be lackadaisical about it. You treated it with contempt and did nothing about it. Or sometimes you even execute, but in a manner as good as not executing. You procrastinated it till the urgency of the idea became watered down in your heart. Then you still went on to be asking God for new ideas, saying “Why am I not becoming wealthy?”.","What He gives you is the <strong>ABILITY TO PRODUCE WEALTH, </strong>He doesn't take the complete ownership or responsibility from you. There are certain actions that you are the one who must take.","There are many other times you exhibit Laziness. As you read this, one of the things you should trust the Holy Spirit to help you do is figure them out and work on them. (Don’t procrastinate that)","<strong>The Subject of Wealth Creation is more about OBEDIENCE than OWNERSHIP. It looks like:</strong>","God gives you an idea, instructing you on how to execute and you obey.","God opens your eyes to a problem no one is paying attention to or they have seen but didn't solve well, then you pick it up and fix it.","God leads you on the right investment to make, then He blesses it.","Does this still look like what a Lazy man can do? DILIGENCE AND OBEDIENCE are important in Wealth Creation for the third category where we belong.","Wisdom attracts riches and honour, enduring wealth and prosperity (Prov. 8:18). Desire wisdom, walk in wisdom, apply knowledge and see Wisdom attract wealth to your house. <strong>WEALTH IS ONE OF THE PACKAGES EMBEDDED IN WISDOM. DESIRE WISDOM ABOVE ALL THINGS.</strong> To the discerning, this is Wisdom!"],"x":"DILIGENCE AND OBEDIENCE are inseparable for the category who trusts God for the ability to produce wealth.","m":2},{"d":23,"t":"Wisdom and the Right Audience","b":["<strong>Proverbs 1:5 NIV - Let the wise listen and add to their learning, and let the discerning get guidance.</strong>","<strong>Proverbs 8:8-9 NIV - All the words of my mouth are just; </strong>none of them is crooked or perverse. <strong>To the discerning all of them are right;</strong> they are faultless to those who have knowledge.","When Wisdom speaks or gives counsel, not everyone receives it the same way. This is why as powerful and wise as the message of the cross is, it is foolishness to those that are perishing. It is foolishness to those who want to make logic out of it. Let's take the Jews for example: Up till today, traditional and mainstream Jews do not believe in the sonship of Christ or that He resurrected And this same message, some of us heard, believed and it happened to be the start of the greatest transformation our lives have experienced. I'm a Living Example.","<strong>Wisdom has an audience. </strong>As one who has started working in the Unconventional Wisdom of God, you'll be doing yourself a disservice thinking everyone will accept or reckon with the message of God's wisdom in your mouth.","<strong>When Wisdom speaks, these are the kind of audience that gets it:</strong>","<strong>A. The Discerning: </strong>Not everyone can discern God's wisdom. Everyone might be able to differentiate between a good thing or a bad thing. But how about when you are faced with two things to choose from and both of them are good? The question shifts from “Is this good or bad?” to “Is this good or God?” This is where discernment comes in.","To those who are an audience of wisdom, the words of wisdom are right. They hardly fall into errors because by discernment, they can tell which area of their life the words directly speak to. Hence, the words of wisdom are right to the discerning (Prov. 8: 9)","<strong>B. The Knowledgeable: </strong>The Knowledgeable finds no fault in the words of wisdom because they aren't listening to find fault. They listen with an open heart and that way, it is easy for wisdom to speak to their needs and the exact area of their pains. The Words of Wisdom are soothing to them.","<strong>When you listen to find faults, you'll always find one. And there's no way you can be instructed by what you've faulted. </strong>"],"x":"Wisdom has an audience. Are you an audience of Wisdom? Also, reckon with the fact that not everyone will accept the words of wisdom in your lips. Find an audience of the discerning and Knowledgeable. Never forget this.","m":2},{"d":24,"t":"Wisdom in Judgement, Pt. I","b":["<strong>Ps. 119:66 - Teach me knowledge and good judgement, for I believe in your commands.</strong>","<strong>Prov 31:4 - It is not for kings, O Lemuel, not for kings to drink wine, not for rulers to crave beer, lest they drink and forget about what the law decrees… (NIV)</strong>","Another version of Proverbs 31:4 says <strong>“...Lest…they don’t know right from wrong and the people who depend on them are hurt. (MSG)</strong>","Do you believe in your Kingship? Do you believe your presence here on earth is God's royalty being present? Have you seen yourself from the lenses of royalty which God has glorified you with? If you are still doubting your kingship, you might struggle with accepting these words you are about to read. But, brace up and ask the Holy Spirit to open you up to your Kingship dimension.","But you are a chosen people, a <strong>royal</strong> priesthood…(1Pet. 2:9)...And hast made us unto our God <strong>kings</strong> and priests: and <strong>we shall reign on the earth</strong>. (Rev. 5:10) You can go ahead to read those two scriptures on your own today and meditate on them better. It will give you a better insight into what this Kingship entails.","If you are the other version who already understands your position as A King, follow me. Even if you don't, still follow me and read till the end.","A Wise man doesn't debate between what is good and what is a sin. He doesn't say “It is not a sin, so what's there if I do it? I'm justified in doing it so far it's not recorded as a sin”.","<strong>The judgement of a wise man isn't between “good” and “bad” but between “good” and “God”.</strong>","Now, let's go back to the text I introduced earlier. That is Proverbs 31:4. For King Lemuel, was it a question of “if beer is good or not?“ NO! It was a situation of the repercussion of beer on the ruler and the kingdom he is to rule over. This same beer was recommended to those in anguish as a means of forgetting their sorrows, but it was rejected for a king. Context!","Wisdom helps you with Context. Wisdom guides you on what to do with context. Wisdom judges by context not general rules or general applications of those rules. Wisdom discerns context and applies the right judgement.","Not all good things are good for you, not all pleasurable things are for you. God's wisdom is what helps you to discern what He is saying in peculiarity to you and the role He will have you play.","It is not good for Kings not to understand contextuality (in alignment to God's word) . It is not good for kings not to apply the right judgement per season. (I added mine…<em>smiles</em>). You are a king! You are a royal priesthood"],"x":"The judgement of a wise man isn't between “good” and “bad” but between “good” and “God”. Wisdom helps you with Context and guides you on what to do with context.","m":2},{"d":25,"t":"Wisdom in Judgement, Pt. II","b":["<strong>1 Cor. 5:12 - It isn’t my responsibility to judge outsiders, but it certainly is your responsibility to judge those inside the church who are sinning.</strong>","This angle we are about to touch is a different angle completely, one we rarely talk about. The Holy Spirit just pointed my attention to it while I was trying to write Pt. II and while reading something entirely different.","It is you people o. The “Don't judge me”, “Don't judge Him” community. I know you reading this, you aren't in their group chat. You pressed the “Exit” button since the first day they added you. Because, tell me why they will add us to a community without informing us. <em>(Smiles) </em>","The wave of “Don't judge me” people propagate in the media space and all around us is dismaying. Let's look at the meaning of “JUDGE” - To Judge, according to Merriam Webster dictionary means to “to form an opinion about through careful weighing of evidence and premises”. Another meaning is “The ability to look at a person's habits, words, and choices to figure out their true moral nature.” If we look at this meaning carefully, you will see that you have judged in one way or the other whether you agree now or not. You have held an opinion about someone which you discovered wasn’t true after careful evaluation or being with them over time.","People even use this passage where Jesus said “Judge not, that ye be not judged (Matthew 7:1) to back up their claims. If you read that passage well, Jesus called out Hypocrites. Those who know how to criticize others, correct others and condemn others with unfair attitudes or out of jealousy. They aren’t doing it because they want you to get better or change, but because they want to bring you down.","Bible Ref, a Bible explanatory site, wrote and I quote “Jesus' other teachings explicitly indicate that right judgment is necessary (John 7:24), while hypocritical or shallow judgment is wrong.”","<strong>Right judgement is necessary, hypocritical judgement is wrong.</strong> Paul showed us an example of what right judgement might look like based on the context of what was happening at that time. He said in <em>1 Cor. 5:12-13,</em> <em>“It isn’t my responsibility to judge outsiders, but it certainly is your responsibility to judge those inside the church who are sinning…God will judge those on the outside.”</em>","<strong>If what you mean by “Don't judge me” is “Don't hold me accountable for the wrong I did”</strong>, “Nobody should say anything, they should all overlook it”, “I don't owe anyone an explanation”, “I don't accept feedbacks”, what you are fighting against isn’t the judgment, <strong>you hate accountability</strong>”.","In the community of faith, the community of wisdom, we hold ourselves accountable. We understand that we can't really go far without accountability.<em> (Read that again)</em>","<strong>Proverbs 9: 8-9 says</strong> “Do not rebuke a mocker or he will hate you; <em>rebuke a wise man and he will love you. Instruct a wise man and he will be wiser still…</em>","Where do you belong? Are you a Mocker or a Wise man?"],"x":"Right judgement is necessary, hypocritical judgement is wrong. Rebuke a wise man and he will love you. Instruct a wise man and he will be wiser still. Don't disguise lack of accountability as “People judging you”. Examine it instead.","m":3},{"d":26,"t":"Wisdom for the Simple, Foolish and Mockers, Pt. I","b":["<strong>Proverbs 1:22 <em>NIV </em>- How long will you who are simple love your simple ways? How long will mockers delight in mockery and fools hate knowledge?</strong>","<strong>Proverbs 1:22 <em>AMP </em>- “How long, O </strong>naive ones [you who are easily misled]<strong>, will you love being simple-minded and undiscerning? How long will </strong>scoffers [who ridicule and deride] <strong>delight in scoffing, how long will </strong>fools [who obstinately mock truth] hate knowledge?","You might have wondered who the Simple, Foolish and Mockers are? Let's check it out. The Amplified version of the Bible already gave us an insight into who these people are and if you find any of these traits in you, it is not the time to harden your heart but to just genuinely ponder on it and trust the Holy Spirit to help you adjust where necessary.","<strong>The Simple: </strong>They are naive and easily misled. They go with the flow and are okay with whatever becomes popular or whatever the world calls wisdom. They are easily influenced by evil. Their mantra is “Soft Life only”. They aren't inquisitive in whatever way and most times ignorant and undiscerning. They reject anything that is contrary to what feels safe to them or can stretch them, even if it is God's wisdom. They love their simple ways and are attached to it. Don't even try to help them out of their simpleness because they are the type who say “That is who I am” or “That's how I've always known how to do my thing”.","<strong>Simple mindedness will make you think Unconventional Wisdom is only for some certain kind of people and not you.</strong> After all, “Life isn't that deep”, that's what you always say until you become a prey to the wiles, schemes and devices of the enemy and the mind control mechanism of the ruler of the kingdom of the air - The spirit who is now at work in those who are disobedient (Ephesians 2:2)","One would have thought God would commend them for being simple. Probably He will say “Thank you for being neutral (you don't hate evil, neither do you love God)” or “Thank you for playing it safe” or “Thank you for being contented and satisfied with the common”. But no, their simple ways have made it hard for them to receive wisdom and their simplicity will only lead them to destruction(Prov 1: 32)"],"x":"Simple-mindedness hinders you from coming into the Unconventional Wisdom of God. If you turn away from simple-mindedness, He will pour out His heart to you and make His thoughts known to you.","m":2},{"d":27,"t":"Wisdom for the Simple, Foolish and Mockers, Pt. II","b":["<strong>Proverbs 1:22 NIV - </strong>How long will you who are <strong>simple</strong> love your simple ways? How long will <strong>mockers</strong> delight in mockery and <strong>fools</strong> hate knowledge?","Let's continue to dig into who the Foolish and the Mockers are.","<strong>The Foolish: </strong>Plot twist, the Foolish aren't those who are drooling (saliva coming out of their mouth) or wearing tattered clothes on the street. They are smart people by human standards. They have the knowledge of technology, finance, business, etc but they have determined to live only by their own knowledge, independent of God. They hate the knowledge of God and they mock the truth. They see no need for godly counsel and have harboured pride.They are close-minded and self confident.","As smart as they are, they are foolish in God's sight. Because they are proud, you can tell what their end is. The self-dependency started with pride only to gravitate to what can ruin them (destruction). <em>Prov 16:18</em>","Foolishness will make you think you are smart and knowledgeable, hence no need for God.","What the Foolish needs is Understanding. It's not as if they don’t know the way of wisdom, but they choose to live independent of it. Are you not also smart by the standards of the world but foolish in the sight of God? To you who are foolish, gain understanding<em>. </em>Seek the insight and self-discipline that leads to godly <strong>wisdom</strong><em> (Prov. 8:5) Emphasis is Mine.</em>","<strong>The Mocker: </strong>They are rebels. They are proud and they make it obvious they hate God. They ridicule those who choose to walk in God's wisdom. They make mockery of those who trust in God's wisdom. They are wise in their own eyes, but God says their end therefore is mockery (Prov.1: 26)","If you have ever found yourself in the midst of this category of people (The Mockers), don't panic. The word of God already spoke about them - their end is destruction. And there's wisdom on how to handle them…Blessed is the man that stands not in the way of sinners <strong>nor sits in the sit of the scornful…(Ps. 1:1)</strong>","Don't sit in their seats, don't indulge them or else they'll change your understanding about God and make you question your convictions about God, even the experiential knowledge you have of Him. They will make you think after all it's not that deep - Just do good, be excellent at your work, love yourself and love everyone around you. As if human nature even has the capacity to love truly except by the help of God through the Holy Spirit.","And if you are one, I pray for you that you'll come into the true revelation of God. He will put an hunger in your heart to seek and as you seek answers, you'll find Him. If you truly come into the revelation of who God is; your perspective and understanding of life will change. GOD IS TOO REAL for us to pretend! GOD IS TOO REAL for us to live as if we own ourselves or as if we have control over the breath of our nostrils.","The pride you have in your knowledge and self-acclaimed wisdom can't even earn you control over the breath of your nostrils and every other thing you want to do on earth. To prove you don't need God is as only relevant as the availability of breath in your nostrils. Take it away, and all the pride ends there. So, who lied to you that the one who has control over your existence and even the breath of your nostrils is not real?"],"x":"Delight in God's word and seek to know His perspective about every topic before accepting it to be true. And when you know His perspective, obey, make it your standard. This is Wisdom!","m":3},{"d":28,"t":"Holy Spirit: The Spirit of Wisdom","b":["<strong>John 16:13-14 NLT - [13] When the Spirit of truth comes, he will guide you into all truth. He will not speak on his own but will tell you what he has heard. He will tell you about the future. [14] He will bring me glory by telling you whatever he receives from me. </strong>","<strong>John 14:26 NIV - But the Advocate, the Holy Spirit, whom the Father will send in my name, will teach you all things and will remind you of everything I have said to you. </strong>","Before you read this, ensure you read the Bible passage above. Go ahead and read it twice. Oh my God! We can't talk about the subject “Unconventional Wisdom” and sideline this topic we'll be discussing today. We can't sideline the Holy Spirit from the subject of Wisdom. Never! Do you know why? Let me tell you one of the reasons.","When I defined Wisdom in the earlier part of this devotional, one of the definitions explained what Wisdom is - Wisdom is the ability to apply the knowledge of the word of God and the knowledge of the person of God towards a course of action and make sound decisions. Life is progressive and we get to meet ourselves in different seasons of life that require different approaches or methods from what we used to know. God himself is diverse in His ways and His ways aren't the ways of men. He can lead you towards a different path or instruct you to use a different approach from what you've been used to. Wisdom then is being placed face-to-face with two right things and still being able to choose not just what is right at that moment but what is God's. How can you then discern this without the Holy Spirit?","Wisdom is one of the expressions of the Holy Spirit…See how John described this - <em>But the Advocate,</em> the Holy Spirit, <em>whom the Father will send in my name,</em> will teach you all things <em>and will</em> remind you of everything I have said (John 14:26).","I wrote this part of the devotional you're reading around 12:31am. That night, I was on a call with my friend and what started as just a random check up became an experience of the Holy Spirit and that was how He spurred me to write this particular part of the devotional. He had given me the topic months ahead, but the contents weren't forming in my heart. But that night, I knew what to write and I was enabled to write it.","Our conversations switched from “Let me just say what's on my heart to my friend” to “How come you know what's in my journal and what the Holy Spirit has been discussing with me?”. We experienced the wisdom of the Holy Spirit and got the same understanding of a matter we hadn't discussed with ourselves prior to that time.","I can go on and on to share my experiences on how I have enjoyed the Wisdom expression of the Holy Spirit. I could remember the time I wanted to name my business then, He gave me the prototypes to study and helped me draw out a name from there that doesn't look like a copy of these prototypes. The name has a relevancy that goes beyond that moment then and it's still relevant up till now. There's no business I want to build or a new venture that doesn't fit into the name. It's an umbrella name. The Holy Spirit goes beyond conversations, business, etc. He is deeper and can be expressed than that. After all, He taught the apostles Languages they didn’t know before (Acts 2:4-12). But, I'm just giving you a glimpse into how practical the Wisdom from the Holy Spirit can be. Don't box Him to one expression.","The Holy Spirit can teach you all things and remind you of everything Jesus has said and has taught (This is me paraphrasing). The Holy Spirit is the one who can teach you what Wisdom means with God. The decisions of Wisdom are practical and they aren't something you make once in a while. The decisions you make daily either contribute to Wisdom and Folly. The Holy Spirit is that enabling spirit who can teach you what Wisdom means daily and enable you to choose wisdom daily.","You cannot truly yield to or engage the Holy Spirit and the Word of God and not become wise. He teaches, He counsels, He guides and even leads you to your teachers (in human form). The Holy Spirit isn't insecure. He can show you those whom He has taught and He is teaching and can also be a voice of guidance to you (in human form). That's still His wisdom.","This is my desire for you:","….<em>That the God of our Lord Jesus Christ, the glorious Father, may give you the Spirit of wisdom and revelation, so that you may know him better.</em> - Ephesians 1:17 NIV."],"x":"The Holy Spirit is the enablement God has given you to be able to walk in His wisdom and will. Quit trying to please God by your own strength. Ask for the enablement of the Holy Spirit. Engage the Holy Spirit in your journey to becoming wiser by God's standards. (Acts 1:8)","m":4},{"d":29,"t":"Receiving Wisdom Without Doubt","b":["<strong>James 1:5 - If any of you lacks wisdom, you should ask God, who gives generously to all without finding fault, and it will be given to you. </strong>","God is willing to give Wisdom to all men. He gives freely and he is not biased. But do you know not everyone will receive wisdom? Not because God isn't willing to give, but for a reason I'm going to show you now.","James 1:6-8 (NIV) puts it this way:","[6] But <em>when you ask, you must believe and not doubt</em>, because <em>the one who doubts is like a wave of the sea, blown and tossed by the wind.</em> [7] <em>That person should not expect to receive anything from the Lord.</em> [8] Such a person is double-minded and unstable in all they do.","Because of their double-mindedness and unstability… Yes! A Double-minded person shouldn't expect to receive anything from the Lord. Our entire journey with God is all encompassed in Faith. Faith is key to receiving from God.","Ask and believe you've received without doubt. Don't wait on His Wisdom concerning a thing and still try to use your own wisdom to sort it out. Not all men have come to that level of total dependence where they don't see themselves as “Wise” in their own eyes and see a need to ask for His wisdom.","There's a kind of heart posture that receives from God - A heart without doubt, a heart with strong conviction that if God says I should ask, then He meant it. He will definitely give. God won't give His wisdom to a man who doesn't have the right heart posture to steward it.","<strong>Salvation is free to all men, but you have to believe in your heart and confess with your mouth the Lordship of Jesus. Likewise wisdom, you have to love Wisdom and desire it.</strong>","Wisdom comes to those who love her (Prov.8:17), Wisdom comes to those who acknowledge they lack it and then proceed to ask God (James 1:5). This Unconventional Wisdom we are talking about, which is Godly Wisdom does not come to those who already think they know. If you desire Godly Wisdom that is unconventional, different from the world's standards but aligned with God's standard and defiling the norms, then you will have to ask with your own mouth. Wisdom cannot be imparted on you by a man except the Lord.","Wisdom comes with a lot of family members (like wealth, riches, honour,etc). That's why you have to be a yielded man at heart and in obedience to the Lord to be able to steward Wisdom appropriately without destroying yourself."],"x":"Ask for Wisdom with no doubt in your heart. Love Wisdom, desire Wisdom and seek the Wisdom that is from God. Do not doubt that He can give you. For anyone who doubts is like a wind tossed to and fro and can fall for anything that disguises itself as Wisdom. Such a person cannot receive God's wisdom.","m":2},{"d":30,"t":"Wisdom Calls for Separation","b":["<strong>Titus 2:11-13 (NIV) - For the grace of God has appeared that offers salvation to all people. It teaches us to say “No” to ungodliness and worldly passions, and to live self-controlled, upright and godly lives in this present age, while we wait for the blessed hope—the appearing of the glory of our great God and Savior, Jesus Christ, </strong>","<strong>The Life of True Wisdom is a Life of Separation . </strong>Not separation from people but separation from worldly cultures. A Life that defies the norms (patterns of thinking, culture, systems, character normalized by the world but doesn't have its root in God and His word).","To choose to live in the Unconventional Wisdom of God is to choose to be set apart, to stand out for Him, even if standing out means saying no to many offers that won't make you not any different from the world and the desires of their heart. <em>If we have the same hunger, passion and desires as the world, how then are we different from them?</em>","Wisdom will make you say <em>“NO” </em>to many things that do not align with your source (God). And <em>“NO”</em> isn't just a mouth declaration but a heart conviction. You can be saying “NO” with your mouth but your heart is still with the world and its desires. Saying “NO” should stem first from a conviction in your heart to be separate for God, then back it up with actions, through the help of the Holy Spirit.","Never forget this: The Holy Spirit can enable you to be separate.","Wisdom will want to create with you what everyone isn't paying attention to yet. He wants to show the possibilities that exist with God, through you . But if you are just obsessed with doing what is popular, trending or is working already for someone else, you can miss out on this dimension of wisdom.","Wisdom calls and He says:","Therefore, “Come out from them and be separate…(2 Corinthians 6:7)","Wisdom affects your association.","He who walks with the wise will be wise, But the companion of fools will be destroyed","If you want to grow in wisdom, spend time with the wise. Walk with the wicked and you will eventually become just like them. <em>(Prov 13:20 TPT).</em>","This is an Invitation to join a community of Kingdom-minded Leaders and builders trained in the order of God’s wisdom. If you’d love to go through a deeper dive into the contents of this devotional alongside others, then this might be the right association you’ve been praying for."],"x":"","m":2}];

  function plain(h) { return String(h).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim(); }
  function cd(n) { return '<b data-unlock-day="' + n + '">' + UW.fmt(Store.msUntil(n)) + '</b>'; }

  /* ---------- list ---------- */
  function renderList() {
    var curN = Store.currentDay(), allDone = Store.allRead();
    var html = DAYS.filter(function (d) {
      var read = Store.state(d.d) === 'read';
      return filter === 'all' || (filter === 'done' ? read : !read);
    }).map(function (d) {
      var st = Store.state(d.d), isCur = d.d === curN && !allDone && st === 'open';
      var status = st === 'read' ? '<span class="pill good">' + icon('check') + 'Read</span>'
        : st === 'waiting' ? '<span class="pill">' + icon('clock') + 'Waiting</span>'
        : st === 'locked' ? icon('lock') : (isCur ? '<span class="pill">Up next</span>' : '');
      var meta = st === 'waiting' ? 'Opens in ' + cd(d.d) : st === 'locked' ? 'Finish Day ' + (d.d - 1) + ' first' : d.m + ' min read';
      var inner = '<span class="top"><span>Day ' + d.d + '</span>' + status + '</span><h3>' + esc(d.t) + '</h3><span class="meta">' + meta + '</span>';
      var cls = 'day-card' + (isCur ? ' current' : '') + (st === 'waiting' || st === 'locked' ? ' locked' : '');
      if (st === 'waiting' || st === 'locked') return '<li><div class="' + cls + '">' + inner + '</div></li>';
      return '<li><a class="' + cls + '" href="#day-' + d.d + '">' + inner + '</a></li>';
    }).join('');
    document.getElementById('day-grid').innerHTML = html || '<li class="muted">Nothing here yet.</li>';
  }

  document.querySelectorAll('[data-filter]').forEach(function (b) {
    b.addEventListener('click', function () {
      filter = b.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      renderList();
    });
  });

  /* ---------- reader ---------- */
  function bodyHtml(day) {
    return day.b.map(function (p) { return SCRIPTURE.test(p) ? '<blockquote>' + p + '</blockquote>' : '<p>' + p + '</p>'; }).join('');
  }

  function setJsonLd(day) {
    document.getElementById('ld-day').textContent = JSON.stringify({
      '@context': 'https://schema.org', '@type': 'Article', headline: 'Day ' + day.d + ': ' + day.t, position: day.d,
      inLanguage: 'en', timeRequired: 'PT' + day.m + 'M',
      isPartOf: { '@type': 'Book', name: 'Unconventional Wisdom: 30-Day Devotional for Leaders and Builders to Learn Godly Wisdom' },
      description: (day.x || plain(day.b[0] || '')).slice(0, 200)
    });
  }

  function renderFinish() {
    var el = document.getElementById('finish'); if (!el) return;
    var n = current, st = Store.state(n), html;
    if (st === 'read') {
      html = '<button class="btn btn-gold complete-btn" type="button" disabled aria-disabled="true">' + icon('check') + 'Day ' + n + ' completed \u00b7 +' + P.read + ' points</button>' +
        (n < TOTAL ? '<p class="muted small complete-note">Day ' + (n + 1) + ' opens at 5am.</p>' : '<p class="muted small complete-note">You have finished all ' + TOTAL + ' days.</p>');
    } else if (!Store.user()) {
      html = '<button class="btn complete-btn" type="button" id="complete-btn">' + icon('lock') + 'Sign in to complete Day ' + n + '</button>' +
        '<p class="muted small complete-note">Create a free account or sign in to complete days, earn points and unlock the next day.</p>';
    } else {
      html = '<button class="btn complete-btn" type="button" id="complete-btn">' + icon('check') + 'Complete Day ' + n + ' \u00b7 +' + P.read + ' points</button>';
    }
    el.innerHTML = html;
  }

  function updateNext() {
    var nx = document.getElementById('next-link'); if (!nx) return;
    var n = current + 1;
    if (Store.isUnlocked(n)) { nx.setAttribute('href', '#day-' + n); nx.removeAttribute('aria-disabled'); nx.classList.remove('is-disabled'); }
    else { nx.removeAttribute('href'); nx.setAttribute('aria-disabled', 'true'); nx.classList.add('is-disabled'); }
  }

  function renderReader(n) {
    var day = DAYS[n - 1]; current = n;
    if (!day) { location.hash = ''; return; }
    var st = Store.state(n);
    kind = (st === 'waiting' || st === 'locked') ? st : 'open';
    document.title = 'Day ' + n + ': ' + day.t + ' | Unconventional Wisdom';
    var md = document.querySelector('meta[name="description"]');

    if (kind !== 'open') {
      if (md) md.setAttribute('content', 'Day ' + n + ' of the Unconventional Wisdom 30-day devotional.');
      document.getElementById('ld-day').textContent = '';
      readerView.innerHTML = '<div class="reader locked-box"><div class="lock-badge">' + icon(kind === 'waiting' ? 'clock' : 'lock') + '</div>' +
        '<p class="muted" style="margin:0">Day ' + n + ' \u00b7 ' + esc(day.t) + '</p>' +
        (kind === 'waiting'
          ? '<h1 tabindex="-1" id="reader-h1">Opens in <span class="big-count" data-unlock-day="' + n + '">' + UW.fmt(Store.msUntil(n)) + '</span></h1><p class="muted" style="max-width:34ch;margin-inline:auto">Each new day opens at 5am.</p>'
          : '<h1 tabindex="-1" id="reader-h1">Day ' + n + ' is locked</h1><p class="muted" style="max-width:34ch;margin-inline:auto">Finish Day ' + (n - 1) + ' to unlock the next day at 5am.</p>') +
        '<a class="btn" href="#day-' + (kind === 'waiting' ? n - 1 : Store.currentDay()) + '">' + (kind === 'waiting' ? 'Review Day ' + (n - 1) : 'Go to your current day') + '</a></div>';
      return;
    }

    if (md) md.setAttribute('content', (day.x || plain(day.b[0] || '')).slice(0, 155));
    setJsonLd(day);
    var fs = parseFloat(localStorage.getItem('uw:fs')) || 1;
    var prev = n > 1 ? '<a class="btn btn-ghost" href="#day-' + (n - 1) + '">' + icon('left') + 'Day ' + (n - 1) + '</a>' : '<span></span>';
    var next = n < TOTAL ? '<a class="btn" id="next-link" href="#day-' + (n + 1) + '">Day ' + (n + 1) + icon('right') + '</a>' : '<a class="btn" href="leaderboard.html">Leaderboard</a>';
    var dose = day.x ? '<section class="dose" aria-label="Key dose"><h2>Dose ' + n + '</h2><p>' + esc(day.x) + '</p></section>' : '';

    readerView.innerHTML =
      '<article class="reader" id="reader-article">' +
      '<div class="reader-top"><a class="btn btn-ghost btn-sm" href="#">' + icon('left') + 'All days</a>' +
      '<div style="display:flex;gap:.25rem;align-items:center"><button class="icon-btn" type="button" data-fs="-1" aria-label="Smaller text" style="font-weight:700;font-size:.85rem">A\u2212</button>' +
      '<button class="icon-btn" type="button" data-fs="1" aria-label="Larger text" style="font-weight:700;font-size:1.1rem">A+</button>' +
      '<button class="icon-btn" type="button" id="share-btn" aria-label="Share this reading">' + icon('share') + '</button></div></div>' +
      '<p class="muted" style="margin-bottom:.3rem">Day ' + n + ' of ' + TOTAL + '</p>' +
      '<h1 id="reader-h1" tabindex="-1">' + esc(day.t) + '</h1>' +
      '<div class="meta-line"><span class="pill">' + day.m + ' min read</span></div>' +
      '<div class="prose" id="prose" style="--fs:' + fs + '">' + bodyHtml(day) + '</div>' + dose +
      '<div class="complete-wrap" id="finish" aria-live="polite"></div>' +
      '<nav class="day-nav" aria-label="Day navigation">' + prev + next + '</nav></article>';
    renderFinish(); updateNext();
  }

  readerView.addEventListener('click', function (e) {
    if (e.target.closest('#complete-btn')) {
      if (!Store.user()) { location.href = 'you.html?next=' + encodeURIComponent('devotional.html#day-' + current); return; }
      var before = Board.me('all'), res = Store.award(current);
      if (res) {
        var msg = 'Day ' + current + ' completed \u00b7 +' + res.gained + ' points';
        var after = Board.me('all');
        if (before && after && after.rank < before.rank) msg += ' \u00b7 up to #' + after.rank;
        if (current < TOTAL) msg += ' \u00b7 Day ' + (current + 1) + ' opens at 5am';
        UW.toast(msg);
      }
      return;
    }
    var fsb = e.target.closest('[data-fs]');
    if (fsb) {
      var steps = [0.9, 1, 1.15, 1.3], cur = parseFloat(localStorage.getItem('uw:fs')) || 1;
      var i = Math.min(steps.length - 1, Math.max(0, Math.max(0, steps.indexOf(cur)) + parseInt(fsb.dataset.fs, 10)));
      localStorage.setItem('uw:fs', steps[i]);
      document.getElementById('prose').style.setProperty('--fs', steps[i]);
      return;
    }
    if (e.target.closest('#share-btn')) {
      if (navigator.share) navigator.share({ title: document.title, url: location.href }).catch(function () {});
      else if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function () { UW.toast('Link copied'); });
      return;
    }
    var nx = e.target.closest('#next-link');
    if (nx && nx.getAttribute('aria-disabled') === 'true') {
      e.preventDefault();
      UW.toast(Store.state(current) === 'read' ? 'Day ' + (current + 1) + ' opens in ' + UW.fmt(Store.msUntil(current + 1)) : 'Complete Day ' + current + ' to open the next day at 5am');
    }
  });

  window.addEventListener('scroll', function () {
    var art = document.getElementById('reader-article');
    if (readerView.hidden || !art) { bar.hidden = true; return; }
    bar.hidden = false;
    var r = art.getBoundingClientRect(), total = r.height - window.innerHeight;
    bar.style.width = (total > 0 ? Math.min(100, Math.max(0, (-r.top / total) * 100)) : 100) + '%';
  }, { passive: true });

  /* ---------- routing ---------- */
  function route() {
    var m = /^#day-(\d+)$/.exec(location.hash);
    if (m) {
      listView.hidden = true; readerView.hidden = false;
      renderReader(parseInt(m[1], 10));
      window.scrollTo(0, 0);
      var h1 = document.getElementById('reader-h1'); if (h1) h1.focus({ preventScroll: true });
    } else {
      readerView.hidden = true; listView.hidden = false; bar.hidden = true;
      document.title = '30-Day Devotional Readings | Unconventional Wisdom';
      document.getElementById('ld-day').textContent = '';
      renderList();
    }
  }
  window.addEventListener('hashchange', route);

  document.addEventListener('uw:change', function () {
    if (!listView.hidden) { renderList(); return; }
    var st = Store.state(current), k = (st === 'waiting' || st === 'locked') ? st : 'open';
    if (k !== kind) { var y = window.scrollY; renderReader(current); window.scrollTo(0, y); }
    else if (kind === 'open') { renderFinish(); updateNext(); }
  });
  route();
})();

</script>
</body>
</html>
