<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin | Unconventional Wisdom</title>
<meta name="robots" content="noindex, nofollow">
<script>try{if(localStorage.getItem('uw:theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Lexend:wght@300..700&display=swap">
<style>
:root{--brand:#6B4026;--gold:#A8734B;--bg:#F6EFE7;--card:#FFFDF9;--ink:#171513;--muted:#6F6259;--line:#E4D8CB;--ok:#2F6B2B;--okbg:#E3EFD6;--no:#9B2C1F;--nobg:#F8DDD8;--wait:#8A5A12;--waitbg:#FBEBC8}
html[data-theme=dark]{--bg:#171513;--card:#1F1B18;--ink:#F3EDE5;--muted:#B5A99D;--line:#3B322C;--ok:#A7D58A;--okbg:#2A3A20;--no:#F4A598;--nobg:#4A2520;--wait:#F0C77A;--waitbg:#3F3015}
*{box-sizing:border-box}body{margin:0;font-family:Lexend,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
h1,h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;margin:0}
button,input{font:inherit;color:inherit}
.bar{background:var(--brand);color:#FFFDF9;position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
.bar>div{max-width:1000px;margin:auto;padding:.8rem 1rem;display:flex;align-items:center;gap:.6rem}
.bar h1{font-size:1.5rem;flex:1}.bar small{opacity:.8;display:none}
.wrap{max-width:1000px;margin:auto;padding:1rem}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem 1rem;cursor:pointer;font-weight:500}
.btn.p{background:var(--brand);border-color:var(--brand);color:#FFFDF9}.btn.d{color:var(--no)}.btn:disabled{opacity:.5}
.bar .btn{background:rgba(255,255,255,.14);border-color:transparent;color:inherit;padding:.4rem .8rem;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.1rem}
.login{max-width:380px;margin:12vh auto;text-align:center}.login h2{font-size:2rem}
.login input{width:100%;padding:.7rem .9rem;margin:.35rem 0;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.login .btn{width:100%;margin-top:.5rem}.err{color:var(--no);font-size:.9rem;min-height:1.3em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin:1rem 0}
.stats .card{padding:.8rem;text-align:center}.stats b{display:block;font-size:1.6rem}.stats span{font-size:.75rem;color:var(--muted)}
.tabs{display:flex;gap:.4rem;overflow-x:auto;margin-bottom:.8rem}.tabs .btn.on{background:var(--ink);color:var(--bg)}
.q{width:100%;padding:.65rem .9rem;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:.8rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;padding:.9rem 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.row>div:first-child{min-width:0;flex:1 1 220px}.row b{display:block}
.row small{color:var(--muted);overflow-wrap:anywhere;display:block}.acts{display:flex;gap:.4rem}
.pill{font-size:.7rem;padding:.15rem .6rem;border-radius:99px;margin-left:.4rem;font-weight:500}
.pending{background:var(--waitbg);color:var(--wait)}.approved{background:var(--okbg);color:var(--ok)}.rejected{background:var(--nobg);color:var(--no)}
.new{animation:fl 2.5s}@keyframes fl{from{background:var(--waitbg)}}
.team{margin-top:1rem}.team h2{font-size:1.4rem;margin-bottom:.4rem}.team form{display:flex;gap:.4rem;margin-top:.7rem}.team input{flex:1;padding:.55rem .8rem;border:1px solid var(--line);border-radius:99px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:99px;z-index:9;max-width:90vw}
.muted{color:var(--muted)}@media(min-width:700px){.bar small{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<script src="firebase-config.js"></script>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import*as A from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import*as D from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const MAX=3,$=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!window.UW_FIREBASE){app.innerHTML='<div class="login card"><h2>Not configured</h2><p class="muted">Add your Firebase settings to firebase-config.js.</p></div>';throw 0}
const fa=initializeApp(window.UW_FIREBASE),auth=A.getAuth(fa),db=D.getFirestore(fa);
let me,roster={uids:[],emails:[]},rows=[],tab='pending',term='',unsubs=[],first=true,fresh=new Set(),sound=localStorage.getItem('uw:adm-snd')!=='0';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
function ago(ts){const s=ts&&ts.toDate?(Date.now()-ts.toDate())/1e3:0;if(!s)return'just now';if(s<60)return'just now';if(s<3600)return~~(s/60)+' min ago';if(s<86400)return~~(s/3600)+' h ago';return ts.toDate().toLocaleDateString()}
function beep(){if(!sound)return;try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);o.start();o.stop(c.currentTime+.4)}catch(e){}}
function alertNew(r){beep();toast('New signup: '+(r.name||r.email));if(window.Notification&&Notification.permission==='granted')new Notification('New signup request',{body:(r.name||'')+' — '+(r.email||'')})}
function login(msg){unsubs.forEach(u=>u());unsubs=[];document.title='Admin | Unconventional Wisdom';
app.innerHTML=`<div class="login card"><h2>Admin sign in</h2><p class="muted small">Authorized administrators only.</p><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><div class="err" id="er">${esc(msg||'')}</div><button class="btn p" id="go">Sign in</button><button class="btn" id="gg">Continue with Google</button></div>`;
const er=m=>$('#er').textContent=m;
$('#go').onclick=()=>A.signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value).catch(()=>er('Incorrect email or password.'));
$('#gg').onclick=()=>A.signInWithPopup(auth,new A.GoogleAuthProvider()).catch(e=>er(e.code==='auth/popup-closed-by-user'?'':'Google sign-in failed.'))}
function denied(){unsubs.forEach(u=>u());app.innerHTML=`<div class="login card"><h2>Access denied</h2><p class="muted">${esc(me.email)} is not an authorized administrator. Only ${MAX} accounts have access.</p><button class="btn" id="so">Sign out</button></div>`;$('#so').onclick=()=>A.signOut(auth)}
A.onAuthStateChanged(auth,async u=>{me=u;if(!u)return login();
try{const s=await D.getDoc(D.doc(db,'config','admins'));if(!s.exists()||!(s.data().uids||[]).includes(u.uid))return denied();roster=s.data()}catch(e){return denied()}
start()});
function start(){first=true;fresh.clear();
app.innerHTML=`<div class="bar"><div><h1>Admin dashboard</h1><small id="who"></small><button class="btn" id="al"></button><button class="btn" id="so">Sign out</button></div></div><main class="wrap"><div class="stats" id="st"></div><div class="tabs" id="tb"></div><input class="q" id="q" type="search" placeholder="Search name or email"><div class="card" id="ls"></div><div class="card team" id="tm"></div></main>`;
$('#who').textContent=me.email;$('#so').onclick=()=>A.signOut(auth);
$('#q').oninput=e=>{term=e.target.value.toLowerCase();list()};
$('#al').onclick=async()=>{if(window.Notification&&Notification.permission==='default')await Notification.requestPermission();sound=!sound;localStorage.setItem('uw:adm-snd',sound?'1':'0');btn()};
btn();
unsubs.push(D.onSnapshot(D.query(D.collection(db,'membershipRequests'),D.orderBy('requestedAt','desc'),D.limit(300)),s=>{
const was=Object.fromEntries(rows.map(r=>[r.id,r.status]));rows=s.docs.map(d=>({id:d.id,...d.data()}));
if(!first)s.docChanges().forEach(c=>{const x=c.doc.data();if(c.type!=='removed'&&x.status==='pending'&&was[c.doc.id]!=='pending'){fresh.add(c.doc.id);alertNew(x)}});
first=false;draw()},e=>toast('Cannot load requests: '+e.code)));
unsubs.push(D.onSnapshot(D.doc(db,'config','admins'),s=>{if(!s.exists()||!(s.data().uids||[]).includes(me.uid))return denied();roster=s.data();team()}))}
function btn(){$('#al').textContent=(sound?'🔔 Alerts on':'🔕 Alerts off')}
function cnt(s){return rows.filter(r=>r.status===s).length}
function draw(){const p=cnt('pending');document.title=(p?'('+p+') ':'')+'Admin | Unconventional Wisdom';
$('#st').innerHTML=[['Pending',p],['Approved',cnt('approved')],['Rejected',cnt('rejected')],['Total',rows.length]].map(x=>`<div class="card"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
$('#tb').innerHTML=['pending','approved','rejected','all'].map(t=>`<button class="btn ${t===tab?'on':''}" data-t="${t}">${t[0].toUpperCase()+t.slice(1)}${t==='pending'&&p?' ('+p+')':''}</button>`).join('');
$('#tb').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;draw()}};list();team()}
function list(){const v=rows.filter(r=>(tab==='all'||r.status===tab)&&(r.name+' '+r.email).toLowerCase().includes(term));
$('#ls').innerHTML=v.length?v.map(r=>`<div class="row ${fresh.has(r.id)?'new':''}"><div><b>${esc(r.name||'Unnamed')}<span class="pill ${esc(r.status)}">${esc(r.status)}</span></b><small>${esc(r.email)} · ${esc(r.provider||'')} · ${ago(r.requestedAt)}</small></div><div class="acts">${r.status!=='approved'?`<button class="btn p" data-a="approved" data-id="${esc(r.id)}">Approve</button>`:''}${r.status!=='rejected'?`<button class="btn d" data-a="rejected" data-id="${esc(r.id)}">Reject</button>`:''}</div></div>`).join(''):'<p class="muted" style="margin:0;text-align:center">Nothing here.</p>';
$('#ls').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;b.disabled=true;const id=b.dataset.id,st=b.dataset.a;
try{const w=D.writeBatch(db),t=D.serverTimestamp();w.set(D.doc(db,'users',id),{status:st,updatedAt:t},{merge:true});w.set(D.doc(db,'membershipRequests',id),{status:st,reviewedAt:t,reviewedBy:me.uid,reviewedByEmail:me.email},{merge:true});await w.commit();fresh.delete(id);toast(st==='approved'?'Member approved':'Request rejected')}catch(x){toast('Failed: '+x.code);b.disabled=false}}}
function team(){const n=roster.uids.length;
$('#tm').innerHTML=`<h2>Administrators (${n} of ${MAX})</h2><p class="muted small" style="margin:0">Only these accounts can open this dashboard. The limit is enforced by the database.</p>`+roster.uids.map((u,i)=>`<div class="row"><div><b>${esc(roster.emails[i]||u)}${u===me.uid?' (you)':''}</b></div>${u===me.uid?'':`<button class="btn d" data-rm="${i}">Remove</button>`}</div>`).join('')+(n<MAX?`<form id="ad"><input type="email" id="ae" placeholder="Email of a signed-up user" required><button class="btn p">Add admin</button></form>`:'<p class="muted small">All seats are taken. Remove an admin to add another.</p>');
const save=async(uids,emails)=>{try{await D.updateDoc(D.doc(db,'config','admins'),{uids,emails,updatedAt:D.serverTimestamp()});toast('Team updated')}catch(e){toast('Failed: '+e.code)}};
$('#tm').onclick=e=>{const i=e.target.dataset.rm;if(i!=null&&confirm('Remove this admin?'))save(roster.uids.filter((_,k)=>k!=i),roster.emails.filter((_,k)=>k!=i))};
const f=$('#ad');if(f)f.onsubmit=async e=>{e.preventDefault();const em=$('#ae').value.trim().toLowerCase();
const s=await D.getDocs(D.query(D.collection(db,'users'),D.where('email','==',em),D.limit(1)));
if(s.empty)return toast('No user with that email. They must sign up first.');const id=s.docs[0].id;if(roster.uids.includes(id))return toast('Already an admin.');
save([...roster.uids,id],[...roster.emails,em])}}
</script>
</body>
</html>
